# PXE Boot Server Configuration for bootstrap_nodes
# ------------------------------------------------------------------------------

# Artifact server URL (for inst.repo, inst.ks, etc.) is defined in
# group_vars/all/main.yml, derived from deevnet_substrate + deevnet_root_domain.

# WAN interface for bootstrap-authoritative mode (upstream connectivity)
# This is the KEY in infrastructure.interfaces (OS interface discovered from MAC)
bootstrap_wan_interface_key: "eth1"

# OPNSense-authoritative mode - use standalone tftpd for TFTP only
# OPNSense handles DHCP/DNS, this host provides TFTP for PXE boot files
bootstrap_tftp_backend: "tftpd"

# Use network-enabled GRUB for UEFI PXE boot
# Built with grub2-mkimage including efinet, tftp, http, net modules
bootstrap_uefi_bootloader: "grub"

# TFTP file ownership (must be dnsmasq for tftp-secure mode)
bootstrap_tftp_owner: "dnsmasq"
bootstrap_tftp_group: "dnsmasq"

# Network interface for DHCP/TFTP/DNS services (downstream)
# This is the KEY in infrastructure.interfaces (OS interface discovered from MAC)
bootstrap_dhcp_interface_key: "eth0"

# DHCP Configuration for management subnet (10.20.99.0/24)
# ------------------------------------------------------------------------------
bootstrap_dhcp_range_start: "10.20.99.100"
bootstrap_dhcp_range_end: "10.20.99.200"
bootstrap_dhcp_lease_time: "12h"

# Network options - in bootstrap-authoritative mode, provisioner is the gateway
# These use the gateway IP (.1), not the provisioner's reserved IP (.95)
bootstrap_dhcp_gateway: "10.20.99.1"
bootstrap_dhcp_netmask: "255.255.255.0"
bootstrap_dhcp_dns_servers:
  - "10.20.99.1"

# DHCP domain
bootstrap_dhcp_domain: "mobile.deevnet.net"

# TFTP directories to create
bootstrap_tftp_dirs:
  - pxelinux.cfg
  - fedora
  - "fedora/{{ deevnet_fedora_current.release }}"
  - "fedora/{{ deevnet_fedora_previous.release }}"

# Netboot Menu Entries
# ------------------------------------------------------------------------------
# Boot menu entries for PXE. Files must be pre-staged by artifacts role.
bootstrap_netboot_images:
  - name: "Fedora {{ deevnet_fedora_current.release }} Server"
    dest_subdir: "fedora/{{ deevnet_fedora_current.release }}"
    boot_options: >-
      inst.repo={{ bootstrap_artifact_server }}/fedora/{{ deevnet_fedora_current.release }}/mirror
      inst.stage2={{ bootstrap_artifact_server }}/fedora/{{ deevnet_fedora_current.release }}/mirror
      inst.ks={{ bootstrap_artifact_server }}/kickstart/builder-node-{{ deevnet_fedora_current.release }}.ks

  - name: "Fedora {{ deevnet_fedora_previous.release }} Server"
    dest_subdir: "fedora/{{ deevnet_fedora_previous.release }}"
    boot_options: >-
      inst.repo={{ bootstrap_artifact_server }}/fedora/{{ deevnet_fedora_previous.release }}/mirror
      inst.stage2={{ bootstrap_artifact_server }}/fedora/{{ deevnet_fedora_previous.release }}/mirror
      inst.ks={{ bootstrap_artifact_server }}/kickstart/builder-node-{{ deevnet_fedora_previous.release }}.ks


# PXE Boot Menu Configuration
# ------------------------------------------------------------------------------
bootstrap_pxe_boot_prompt: "Press <Tab> for boot options, <Enter> to boot default"
bootstrap_pxe_timeout: 300
bootstrap_grub_timeout: 30

# MAC-specific GRUB Configs (UEFI auto-boot without menu)
# ------------------------------------------------------------------------------
# These create grub.cfg-XX-XX-XX-XX-XX-XX files for automated installs
bootstrap_grub_mac_configs:

  - hostname: dv02bld002v01
    mac: "{{ hostvars['dv02bld002v01'].infrastructure.interfaces.eth0.mac }}"
    image_name: "Fedora {{ deevnet_fedora_current.release }} Server"
    dest_subdir: "fedora/{{ deevnet_fedora_current.release }}"
    boot_options: >-
      inst.repo={{ bootstrap_artifact_server }}/fedora/{{ deevnet_fedora_current.release }}/mirror
      inst.stage2={{ bootstrap_artifact_server }}/fedora/{{ deevnet_fedora_current.release }}/mirror
      inst.ks={{ bootstrap_artifact_server }}/kickstart/builder-node-{{ deevnet_fedora_current.release }}.ks

# DNS Configuration
# ------------------------------------------------------------------------------
# Enable DNS forwarding (upstream servers populated dynamically by playbook)
bootstrap_enable_dns: true
bootstrap_dns_upstream_servers: []

# Service Configuration
# ------------------------------------------------------------------------------
# dnsmasq service disabled (using tftpd backend instead)
bootstrap_dnsmasq_service_enabled: false

# DHCP disabled - OPNSense is authoritative for DHCP
bootstrap_dnsmasq_dhcp_enabled: false

# Logging (useful for debugging)
# ------------------------------------------------------------------------------
bootstrap_dnsmasq_log_queries: false
bootstrap_dnsmasq_log_dhcp: true
