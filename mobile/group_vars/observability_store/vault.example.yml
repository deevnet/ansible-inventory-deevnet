# Example vault: every key this vault holds, with its value emptied.
# A new site copies it to vault.yml (scripts/make-empty-vault.sh), fills it in,
# and runs `make vault` before committing. Generated by scripts/vault-examples.py.

---
# The operator's read token for the log store (ADR-0022 §3, CHG-0018). Reads
# every partition; held only by vmauth on dv02obs001v01 and the operator.
vault_victorialogs_operator_read_token: ""

# The MQTT bridge's token has MOVED to group_vars/all/vault.yml (CHG-0021).
# Two hosts need the same value - vmauth here is configured with it, and the
# bridge on the messaging VM presents it - and a secret copied into two group
# vaults is a secret that drifts.

# Grafana's secret_key (CHG-0024): encrypts data-source secrets - the
# tenants' read tokens - inside Grafana's SQLite. The default is a public
# constant. Keep it stable: a new key leaves stored secrets unreadable until
# the API re-ensures every tenant.
#   openssl rand -hex 32
vault_grafana_secret_key: ""
