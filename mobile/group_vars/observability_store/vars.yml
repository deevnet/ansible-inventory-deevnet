---
# The observability store (ADR-0022, CHG-0018): VictoriaLogs behind vmauth.
# Tokens are beside this file in vault.yml (the operator's) and in each
# log_shippers host's own host_vars/<host>/vault.yml (its ingest token).

# --- TLS from the site CA ----------------------------------------------------
# The same settings as mqtt_brokers, and for the same reasons: every OpenBao
# call runs on the control node, so this VM needs no path to OpenBao.
victorialogs_openbao_addr: "https://{{ hostvars[groups['openbao'] | first].env.interfaces.eth0.ip }}:8200"
victorialogs_openbao_ca_local: "{{ playbook_dir }}/../.openbao/{{ groups['openbao'] | first }}-listener.pem"
victorialogs_openbao_ansible_role_id: "{{ hostvars[groups['openbao'] | first].vault_openbao_ansible_role_id | default('') }}"
victorialogs_openbao_ansible_secret_id: "{{ hostvars[groups['openbao'] | first].vault_openbao_ansible_secret_id | default('') }}"

# No syslog sources: ADR-0027 removed the unauthenticated syslog listener, so
# the store takes nothing but authenticated writes through vmauth (CHG-0019).
