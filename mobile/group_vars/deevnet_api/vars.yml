---
# The Deevnet API's tenant configuration (ADR-0015). Everything the API derives
# per tenant comes from these site values and the tenant's index.
#
# OFF until deevnet_api_site is set. Turning it on needs, in this order:
#   1. OpenBao deployed on the identity VM (openbao group, ADR-0016), and
#      vault_openbao_ansible_role_id / _secret_id in the vault from its first run
#   2. the API image that serves tenants staged, and deevnet_api_version bumped
#   3. vault_powerdns_api_key in group_vars/all/vault.yml, and the powerdns role
#      re-run on the tenant DNS host (turns on its HTTP API for this host only)
#   4. vault_minio_deevnet_api_secret in group_vars/all/vault.yml, and the minio
#      role re-run (creates this API's own admin user)
#   5. a Proxmox token for the API on the tenant hypervisor, and
#      vault_deevnet_api_token_hmac_key, in this group's vault
#   6. deevnet_api_site: "{{ deevnet_substrate }}" below
# The role refuses to start the API with any of these missing, and names them.
# All six were done in CHG-0010; setting this is what turned the API on.
deevnet_api_site: "{{ deevnet_substrate }}"

# ADR-0002 VNI bases for this site: 10000 + n for the VRF, 20000 + 10n + i for
# VNets. The tenant module's defaults, stated here because the API allocates.
deevnet_api_vrf_vni_base: 10000
deevnet_api_vnet_vni_base: 20000

# What tenants are told, by name, so the services can move hosts.
deevnet_api_dns_update_server: "tdns.{{ deevnet_substrate }}.{{ deevnet_root_domain }}"
deevnet_api_state_endpoint: "http://tfstate.{{ deevnet_substrate }}.{{ deevnet_root_domain }}:9000"

# ADR-0005: the apex NS and SOA primary of every tenant zone is the tenant DNS
# host's own A record (tdns is a CNAME, which an NS may not point at).
deevnet_api_dns_apex_ns: "{{ groups['tenant_dns'] | first }}.{{ deevnet_substrate }}.{{ deevnet_root_domain }}"

# Networks that may attempt a dynamic update; TSIG decides. The same three the
# powerdns role admits: the Builder, operator laptops, and tenant workloads
# SNATed from transit.
deevnet_api_dns_update_from:
  - "{{ deevnet_vlans.management.subnet }}"
  - "{{ deevnet_vlans.trusted.subnet }}"
  - "{{ deevnet_vlans.tenant_transit.subnet }}"

# The core router forwards tenant zones to the tenant DNS host's address.
deevnet_api_resolver_forward_to: "{{ hostvars[groups['tenant_dns'] | first].env.interfaces.eth0.ip }}"

# Backends. The API sits on Platform, so it reaches the router at its Platform
# gateway, the DNS host and the state store directly, and the tenant hypervisor
# over management (ADR-0015 Consequences: the narrow rules CHG-0007 must add).
deevnet_api_powerdns_url: "http://{{ hostvars[groups['tenant_dns'] | first].env.interfaces.eth0.ip }}:8081"
deevnet_api_opnsense_url: "https://{{ deevnet_vlans.platform.gateway }}/api"
# Same VM as the state store: reached at the host's own address, where MinIO
# publishes its port, from the API's podman network.
deevnet_api_minio_endpoint: "{{ hostvars[groups['tenant_state'] | first].env.interfaces.eth0.ip }}:9000"
deevnet_api_proxmox_url: "https://{{ hostvars['dv02hyp002p02'].env.interfaces.eth0.ip | default('10.20.99.22') }}:8006"

# OpenBao (ADR-0016): where the API and Ansible reach it, and the listener
# certificate the openbao role fetched to the control node.
deevnet_api_openbao_addr: "https://{{ hostvars[groups['tenant_dns'] | first].env.interfaces.eth0.ip }}:8200"
deevnet_api_openbao_ca_local: "{{ playbook_dir }}/../.openbao/{{ groups['tenant_dns'] | first }}-listener.pem"

# Ansible's own AppRole, which every role that configures OpenBao logs in with.
# It is kept with OpenBao's other bootstrap secrets in group_vars/openbao, and
# this host is not in that group, so it is read from the OpenBao host - the same
# way the router's API key is read from the router above.
deevnet_api_openbao_ansible_role_id: "{{ hostvars[groups['openbao'] | first].vault_openbao_ansible_role_id | default('') }}"
deevnet_api_openbao_ansible_secret_id: "{{ hostvars[groups['openbao'] | first].vault_openbao_ansible_secret_id | default('') }}"

# The API's backend credentials, written by the role into its OpenBao KV secret.
# The vault stays their source; rotating one is a vault edit and a role run.
deevnet_api_backends:
  powerdns_api_key: "{{ vault_powerdns_api_key | default('') }}"
  opnsense_api_key: "{{ hostvars[groups['routers'] | first].vault_opnsense_api_key | default('') }}"
  opnsense_api_secret: "{{ hostvars[groups['routers'] | first].vault_opnsense_api_secret | default('') }}"
  minio_admin_access_key: deevnet-api
  minio_admin_secret_key: "{{ vault_minio_deevnet_api_secret | default('') }}"
  proxmox_token_id: "{{ vault_deevnet_api_proxmox_token_id | default('') }}"
  proxmox_token_secret: "{{ vault_deevnet_api_proxmox_token_secret | default('') }}"
  # Base64 of at least 32 bytes: head -c 32 /dev/urandom | base64
  token_hmac_key: "{{ vault_deevnet_api_token_hmac_key | default('') }}"
