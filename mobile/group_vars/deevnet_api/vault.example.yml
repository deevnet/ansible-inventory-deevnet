# Example vault: every key this vault holds, with its value emptied.
# A new site copies it to vault.yml (scripts/make-empty-vault.sh), fills it in,
# and runs `make vault` before committing. Generated by scripts/vault-examples.py.

---
# Deevnet API (ADR-0012). Generated 2026-09-14 for CHG-0008.
vault_deevnet_api_token: ""
vault_deevnet_api_db_password: ""

# --- Tenants (ADR-0015) -------------------------------------------------------

# The MAC key of tenant API tokens. A tenant can restore itself after the API's
# registry is lost only while this key is unchanged, so it outlives the database
# and must not be regenerated casually.
#   head -c 32 /dev/urandom | base64
vault_deevnet_api_token_hmac_key: ""

# The Proxmox token the API builds tenant networks and workloads with: role
# DeevnetTenantBuilder on hv02, with Sys.Audit scoped to /nodes through
# DeevnetNodeAudit. Proxmox shows a secret once, so re-issuing means deleting
# and re-creating the token.
vault_deevnet_api_proxmox_token_id: ""
vault_deevnet_api_proxmox_token_secret: ""

# --- The broker account writer (CHG-0016) -------------------------------------

# The API's OWN SSH key, used for nothing else, so revoking it revokes exactly
# the capability to write MQTT broker accounts and nothing more.
#
# Its public half is vernemq_writer_public_key in group_vars/mqtt_brokers, where
# it is pinned in authorized_keys with command=, restrict and from=. The key
# grants no shell: sshd runs one program that reads one JSON request and writes
# one response, and never interprets SSH_ORIGINAL_COMMAND.
#
# Generated 2026-09-20:
#   ssh-keygen -t ed25519 -N "" -C "deevnet-api broker account writer (CHG-0016)"
# Rotating it means replacing both halves in the same change: the public one on
# the messaging VM, the private one here, then the deevnet_api role to push it
# into OpenBao. Replacing only one leaves the API unable to issue accounts.
vault_deevnet_api_broker_writer_key: ""

# The API's OWN SSH key for the log store's user writer (ADR-0027, CHG-0020).
# A different key from the broker's on purpose: two writers on two hosts, and
# revoking one must not revoke the other.
vault_deevnet_api_log_writer_key: ""
