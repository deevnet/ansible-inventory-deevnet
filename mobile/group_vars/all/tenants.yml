---
# Tenant registry for this site.
#
# One row per tenant, allocated in the tenant factory's TENANTS.md. `index` is
# the single number of ADR-0002 from which every other identifier derives - VRF
# VNI, VNet VNI, overlay subnet, and (ADR-0004) the reverse DNS zone.
#
# This list is the substrate's side of tenant onboarding. Two things consume it:
#
#   - proxmox_tenant_egress on the fabric exit node, giving each tenant VRF a
#     way out (ADR-0003)
#   - tenant DNS: zone creation and TSIG issue on the tenant_dns host, and the
#     matching Unbound delegation on the core router (ADR-0004)
#
# Adding a tenant here is an onboarding act, done once. Everything that recurs -
# records, rebuilds, destroys - is the tenant's own Terraform and never touches
# this file.
deevnet_tenants: []

# The fabric attachment the substrate ISSUES to a tenant at onboarding, beside
# its TSIG key (ADR-0004) and its egress (ADR-0003). A tenant needs these two
# values to instantiate the tenant module, and now that tenants live in their
# own repositories it can no longer read them out of the fabric's state by
# relative path.
#
# This is not a tenant hardcoding substrate internals: the substrate hands them
# over, in the same one-time act that hands over the key and the route. A tenant
# never invents them. `make fabric-contract` in the tenant factory diffs these
# against `terraform -chdir=fabric/mobile-dv02hyp002p02 output -json`, which stays the
# source of truth.
#
# Single-member fabric today (ADR-0001 Phase 1), so `node` is a site constant.
# When a second member arrives it becomes a per-tenant choice and this moves
# into the per-tenant row above.
deevnet_tenant_fabric:
  controller_id: evpn1
  node: pve2

# deevnet_site_octet moved to group_vars/all/main.yml. It is site identity, not
# tenant data, and the MAC namespace derives from it too - see there.

# Zone names are derived from the row, never listed. For tenant `t` index `n`:
#
#   forward   {{ t }}.{{ deevnet_substrate }}.{{ deevnet_root_domain }}
#   reverse   {{ 128 + n }}.{{ deevnet_site_octet }}.10.in-addr.arpa
#   subnet    10.{{ deevnet_site_octet }}.{{ 128 + n }}.0/24
#
# tdemo (n=1) -> tdemo.mobile.deevnet.net / 129.20.10.in-addr.arpa / 10.20.129.0/24
