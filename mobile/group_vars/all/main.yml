deevnet_root_domain: deevnet.net
deevnet_substrate: dvntm

# Derive ansible_host from env.interfaces.<if>.ip
ansible_host: >-
  {{
    (
      env.interfaces
      | dict2items
      | selectattr('value.ansible', 'defined')
      | selectattr('value.ansible')
      | map(attribute='value.ip')
      | list
      | first
    )
    | default(
      (
        env.interfaces
        | dict2items
        | map(attribute='value.ip')
        | reject('equalto', None)
        | reject('equalto', 'dhcp')
        | list
        | first
      ),
      true
    )
  }}

# Public key of the automation user. Every host is reachable as a_autoprov with
# this key, so it is declared once here rather than per consuming group: the
# artifact server publishes it, and cloud-init injects it into new VMs.
deevnet_autoprov_ssh_key: >-
  ssh-rsa  a_autoprov@vdvntm-admin-01

# Deterministic FQDN helper
deevnet_fqdn: "{{ inventory_hostname }}.{{ deevnet_substrate }}.{{ deevnet_root_domain }}"

# --- Site identity ------------------------------------------------------------
# Second octet of the site block: 20 = dvntm, 10 = dvnt (ADR-0002). Read from
# the addressing plan rather than restated, so the two cannot disagree.
deevnet_site_octet: "{{ deevnet_vlans.management.subnet.split('.')[1] }}"

# MAC namespace for addresses we ASSIGN, per docs/standards/mac-naming.
# 02 = locally administered, de = Deevnet, third octet = the site octet above,
# so the namespace follows the environment with no second place to edit.
#
# This governs MACs we assign to NICs we create. MACs we OBSERVE - bare-metal
# NICs, and the pre-existing Proxmox guests still carrying bc:24:11: addresses -
# are recorded as found and are never rewritten. Both live at
# infrastructure.interfaces.<iface>.mac and are authoritative in git.
deevnet_mac_namespace: "02:de:{{ deevnet_site_octet }}"

# VMID range the allocator draws management-plane identities from. The VMID is
# the sole source of the MAC, so this is also the MAC range. The hypervisors are
# not clustered, so uniqueness across the substrate is enforced by the allocator
# (deevnet.mgmt playbooks/vm-identity.yml), not by Proxmox.
#
# Ranges do not overlap between sites: home 100-199, mobile 200-299. The MAC
# namespace already differs by site octet, so this is not what keeps MACs apart
# - it makes the VMID itself unique estate-wide, so a VM restored onto the wrong
# site cannot land on an occupied identity.
deevnet_mgmt_vmid_range:
  start: 200
  end: 299

# Fedora Server releases tracked by this substrate
# ------------------------------------------------------------------------------
# Bumping a release: move `current` -> `previous`, then set the new `current`.
# Every Fedora URL, dest_subdir and PXE menu entry derives from these.
deevnet_fedora_mirror: "https://download.fedoraproject.org/pub/fedora/linux/releases"

# Mirror roots, each already including that mirror's own layout prefix, so a
# single rsync_path works across all of them. kernel.org's `fedora` module is
# rooted where the others expose `.../linux`, which is why the prefix differs.
deevnet_fedora_rsync_mirrors:
  - "rsync://dl.fedoraproject.org/fedora-enchilada/linux"
  - "rsync://mirrors.kernel.org/fedora"
  - "rsync://mirror.math.princeton.edu/pub/fedora/linux"

deevnet_fedora_current:
  release: "44"
  build: "1.7"

deevnet_fedora_previous:
  release: "43"
  build: "1.6"

# Base URL of the artifact server, used by kickstarts and PXE boot options.
# Defined here (not just bootstrap_nodes.yml) so the artifacts role can render
# kickstart templates without depending on group membership overlap.
bootstrap_artifact_server: "http://artifacts.{{ deevnet_substrate }}.{{ deevnet_root_domain }}"
