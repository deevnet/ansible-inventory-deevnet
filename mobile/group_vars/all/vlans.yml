# VLAN segment definitions for mobile substrate
# Addressing convention: 10.20.{vlan_id}.0/24
deevnet_vlans:
  trusted:
    vlan_id: 10
    subnet: "10.20.10.0/24"
    gateway: "10.20.10.1"
    dhcp_range_start: "10.20.10.100"
    dhcp_range_end: "10.20.10.200"
    wifi_ssid: "DVNTM"
  storage:
    vlan_id: 20
    subnet: "10.20.20.0/24"
    gateway: "10.20.20.1"
    dhcp_enabled: false  # Static mappings only
  platform:
    vlan_id: 25
    subnet: "10.20.25.0/24"
    gateway: "10.20.25.1"
    dhcp_enabled: false  # Static mappings only
  iot:
    vlan_id: 30
    subnet: "10.20.30.0/24"
    gateway: "10.20.30.1"
    dhcp_range_start: "10.20.30.100"
    dhcp_range_end: "10.20.30.200"
    wifi_ssid: "DVNTM-IOT"
  iot_vendor:
    vlan_id: 31
    subnet: "10.20.31.0/24"
    gateway: "10.20.31.1"
    dhcp_range_start: "10.20.31.100"
    dhcp_range_end: "10.20.31.200"
    wifi_ssid: "DVNTM-IOTV"
  iot_backend:
    vlan_id: 35
    subnet: "10.20.35.0/24"
    gateway: "10.20.35.1"
    dhcp_enabled: false  # Static mappings only
  guest:
    vlan_id: 40
    subnet: "10.20.40.0/24"
    gateway: "10.20.40.1"
    dhcp_range_start: "10.20.40.50"
    dhcp_range_end: "10.20.40.250"
    wifi_ssid: "DVNTM-GUEST"
  # --- Tenant fabric transport (ADR-0001 / ADR-0002) ---------------------------
  # Tenants are NOT VLANs. A tenant is an EVPN/VXLAN overlay owned by the tenant
  # hypervisor's own SDN fabric, with its own anycast gateway and IPAM. The
  # substrate therefore carries exactly two tenant-related segments, and adding a
  # tenant requires no change here and no switch change.
  #
  # Replaced tenant_1/2/3 (VLAN 50/51/52), the superseded Option A model in which
  # each tenant was a core-router-owned VLAN. They never carried traffic - dv02hyp002p02
  # was never trunked - so the IDs are reused rather than retired.
  tenant_transit:
    vlan_id: 50
    subnet: "10.20.50.0/24"
    gateway: "10.20.50.1"
    dhcp_enabled: false  # Static: fabric exit nodes only (dv02hyp002p02 = .22)
  tenant_underlay:
    vlan_id: 51
    # Deliberately no subnet/gateway, like blackhole below. This segment is
    # VTEP-to-VTEP transport between fabric members; the core router neither
    # routes it nor holds an address on it. Fabric-side addressing (10.20.51.0/24,
    # dv02hyp002p02 = .22) lives with the fabric, in host_vars/dv02hyp002p02 and ADR-0002.
    dhcp_enabled: false
  management:
    vlan_id: 99
    subnet: "10.20.99.0/24"
    gateway: "10.20.99.1"
    dhcp_range_start: "10.20.99.200"
    dhcp_range_end: "10.20.99.230"
    # TODO: Remove DHCP pool after Proxmox VMs on dv02hyp001p01 are migrated to proper VLANs
  blackhole:
    vlan_id: 999
    dhcp_enabled: false
