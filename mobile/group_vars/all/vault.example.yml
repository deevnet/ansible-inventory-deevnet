# Example vault: every key this vault holds, with its value emptied.
# A new site copies it to vault.yml (scripts/make-empty-vault.sh), fills it in,
# and runs `make vault` before committing. Generated by scripts/vault-examples.py.

# WiFi PSK secrets — keyed by VLAN name (matches deevnet_vlans keys)
# Only shared-key segments appear here. The `iot` segment is PPSK (CHG-0013):
# its keys are one per tenant, written into the DVNTM-IOT profile by the Deevnet
# API, and omada-wireless.yml refuses to run if a ppsk segment still has a shared
# key here.
# Encrypt with: make vault
deevnet_wifi_psk:
  trusted: ""
  iot_vendor: ""
  guest: ""
  tenant_dev: ""
# vault_tenant_tsig_keys and vault_tenant_state_keys were removed in CHG-0010
# step 11. The Deevnet API generates a tenant's TSIG and state secrets and hands
# them back at admission; the tenant's own Terraform state is the authoritative
# copy (ADR-0015 §4), and the API keeps its copy Transit-encrypted (ADR-0016).
# The values that were here had already been superseded by API-generated ones,
# so they were stale as well as unread.

# MinIO's root user, for the state store's own administration only.
vault_minio_root_user: ""
vault_minio_root_password: ""
# vault_mqtt_users was removed in CHG-0017.
#
# It held Mosquitto passwords for lightd and lp-stand-01. Nothing read them
# after CHG-0015 replaced Mosquitto with VerneMQ - the only consumer was the
# `mosquitto` role, which no play invoked and which is now deleted.
#
# A tenant's broker accounts are now issued by the Deevnet API and declared in
# the tenant's own Terraform (ADR-0012 §3; CHG-0016). The API stores a bcrypt
# hash and never the plaintext, so the tenant's state is the only copy - which
# is why the substrate no longer holds one here.

# --- Deevnet API and OpenBao (ADR-0015, ADR-0016) -----------------------------

# PowerDNS's HTTP API key. Global to the server, so it is only ever given to the
# Deevnet API; tenants keep publishing over RFC 2136 with their own TSIG keys.
# Setting it is what turns the HTTP API on (and restarts pdns-auth).
#   openssl rand -hex 32
vault_powerdns_api_key: ""

# The API's own MinIO admin user, never root.
#   openssl rand -hex 20
vault_minio_deevnet_api_secret: ""

# The exit node's egress agent (ADR-0015 §7). Here rather than in host_vars
# because two hosts need it: the API serves it as DEEVNET_AGENT_TOKEN, and the
# tenant hypervisor presents it. It reads the VRF list and nothing else.
#   openssl rand -hex 32
vault_deevnet_egress_agent_token: ""

# The MQTT log bridge's store token (ADR-0027 §4, CHG-0020, CHG-0021). Here
# rather than in either host's group, for the same reason as the egress agent's
# above: two hosts need the same value. vmauth on the observability store is
# configured with it, and the bridge on the messaging VM presents it.
#
# ONE token for every tenant. What confines it is not the token but its routes:
# vmauth holds one url_map entry per tenant, matched by the tenant header the
# bridge sets per message, and each of those writes only that tenant's
# (index, 2). A tenant the API has never created has no route, so a batch for
# one is refused rather than filed somewhere.
#   openssl rand -hex 32
vault_victorialogs_bridge_token: ""

# Grafana's server admin (ADR-0024, CHG-0024). Two hosts need it: Grafana on
# dv02obs001v01 is started with it, and the Deevnet API uses it to create each
# tenant's org, login and data sources. Shared here for the same reason as the
# bridge token above.
#   openssl rand -hex 32
vault_grafana_admin_password: ""

# The image-factory AppRole (CHG-0026): read-only on image-factory/proxmox/*,
# 15-minute three-use tokens. scripts/pve-creds (image factory, tenant fabric)
# logs in with these to fetch the Proxmox API token per build. Issued by the
# openbao role; rotate by issuing a new secret-id there.
vault_openbao_image_factory_role_id: ""
vault_openbao_image_factory_secret_id: ""

# The site's Substrate CA's private key (ADR-0031 §3). Written by deevnet.mgmt's
# playbooks/substrate-ca.yml; its certificate, signed offline by the Site CA, is
# in pki/<site>/. It signs every substrate server certificate on the control
# node. The Root CA's and Site CA's keys are offline and never here.
vault_site_substrate_ca_key: ""
