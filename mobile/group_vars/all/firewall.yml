# Zone-based firewall policy matrix for mobile substrate
# Derived from network-segmentation.md architecture.
# Default policy: deny all inter-VLAN traffic.
# Rules below define explicit allows.
#
# Zones map 1:1 to deevnet_vlans keys. tenant_underlay has no zone on purpose -
# it carries no routed traffic and the core router holds no address on it.

firewall_zone_policies:
  # Management -> all zones (full infrastructure access)
  - { from_zone: management, to_zone: trusted, action: pass }
  - { from_zone: management, to_zone: storage, action: pass }
  - { from_zone: management, to_zone: platform, action: pass }
  - { from_zone: management, to_zone: iot, action: pass }
  - { from_zone: management, to_zone: iot_vendor, action: pass }
  - { from_zone: management, to_zone: iot_backend, action: pass }
  - { from_zone: management, to_zone: guest, action: pass }
  - { from_zone: management, to_zone: tenant_transit, action: pass }

  # Trusted -> broad access (not guest, not iot_vendor)
  - { from_zone: trusted, to_zone: management, action: pass }  # lab exception: convenience access to mgmt plane
  - { from_zone: trusted, to_zone: storage, action: pass }
  - { from_zone: trusted, to_zone: platform, action: pass }
  - { from_zone: trusted, to_zone: iot, action: pass }
  - { from_zone: trusted, to_zone: iot_backend, action: pass }
  - { from_zone: trusted, to_zone: tenant_transit, action: pass }

  # Operator access to tenant WORKLOADS (ADR-0018, CHG-0012).
  #
  # The two rules above reach tenant_transit, 10.20.50.0/24 - the segment the
  # fabric exit node SNATs to. They do NOT reach a tenant's workloads, which
  # live in the overlay at 10.20.128.0/18, because each rule's destination is
  # rendered from its zone's own subnet. The override is what names the overlay.
  #
  # One aggregate route covers every tenant: ADR-0002 allocates the overlay as a
  # /18, subnet 10.20.(128+index).0/24, so adding a tenant still changes nothing
  # here. The core router carries the matching static route, by hand - no role
  # manages OPNsense static routes yet (CHG-0012 follow-up).
  #
  # Declared before CHG-0007 enforces the matrix. Without these two rules that
  # change would silently take operator access away again.
  #
  # One direction only: the operator reaches a tenant. Nothing here lets a
  # tenant reach management or trusted, and no other zone gains a path - iot,
  # iot_vendor and guest still cannot reach a workload.
  - { from_zone: management, to_zone: tenant_transit, action: pass, destination_net: "10.20.128.0/18",
      name: "tenant overlay (ADR-0018)" }
  - { from_zone: trusted, to_zone: tenant_transit, action: pass, destination_net: "10.20.128.0/18",
      name: "tenant overlay (ADR-0018)" }

  # Tenant fabric -> platform only (shared services).
  # Per ADR-0001 the core router sees the aggregate transit network, never an
  # individual tenant subnet: tenant traffic arrives here already SNATed by the
  # fabric exit node. Per-tenant isolation is enforced inside the fabric (one
  # VRF per tenant), not by a rule here.
  - { from_zone: tenant_transit, to_zone: platform, action: pass }

  # Tenant fabric -> IoT Backend, so a tenant workload can publish to the MQTT
  # broker. Added for EdS: lightd runs in the eds tenant and drives the LP
  # jacket stand, which subscribes from the IoT segment.
  #
  # The direction matters and is the reason the broker is NOT a tenant VM. MQTT
  # clients always dial the broker, so whichever segment holds it must accept
  # inbound - and no device can dial a tenant. IoT Backend is already the segment
  # defined to accept inbound MQTT from IoT, so the broker lives there and the
  # tenant reaches OUT to it, over the transit path that already works.
  #
  # ADR-0018 later gave the operator networks a route into the tenant overlay,
  # which does not change this: that route is management and trusted only, and
  # iot and iot_vendor still have no path to a tenant.
  #
  # Like the rule above, this is zone-level rather than per-tenant: the core
  # router sees only SNATed transit traffic, so it could not distinguish one
  # tenant from another even if it wanted to.
  - { from_zone: tenant_transit, to_zone: iot_backend, action: pass }

  # The Deevnet API's two reaches outside Platform (ADR-0015, CHG-0010 step 7).
  # Narrow on purpose: one source host, one destination, one port. The API holds
  # the privileged credentials for the whole substrate, so what it may reach is
  # worth stating exactly rather than opening Platform to management.
  #
  # Declared before they are needed. The router passes everything until CHG-0007
  # applies this matrix, and these are what keep that change from cutting tenant
  # provisioning off at the moment it starts enforcing.
  - from_zone: platform
    to_zone: management
    action: pass
    name: "deevnet-api -> tenant hypervisor API"
    protocol: TCP
    source_net: "{{ hostvars['dv02prv001v01'].env.interfaces.eth0.ip }}/32"
    destination_net: "{{ hostvars['dv02hyp002p02'].env.interfaces.eth0.ip }}/32"
    destination_port: "8006"

  # The router's own API, reached at its address on Platform. Same zone in and
  # out, which is not a transit rule at all: it is traffic to the firewall
  # itself, and under a default-deny interface policy it needs stating.
  - from_zone: platform
    to_zone: platform
    action: pass
    name: "deevnet-api -> core router API"
    protocol: TCP
    source_net: "{{ hostvars['dv02prv001v01'].env.interfaces.eth0.ip }}/32"
    destination_net: "{{ deevnet_vlans.platform.gateway }}/32"
    destination_port: "443"

  # IoT -> IoT Backend (sensor data)
  - { from_zone: iot, to_zone: iot_backend, action: pass }

  # IoT Backend -> Platform (shared services)
  - { from_zone: iot_backend, to_zone: platform, action: pass }

# Rules that are never deletion candidates on this substrate, on top of the two
# anti-lockout rules the role protects by default.
#
# trusted -> management is the operator's own path to the management plane - it
# is how a workstation on VLAN 10 reaches dv00bld001p01, and losing it means the
# next repair happens at the console. It is a declared policy, so it is only at
# risk if someone removes it from the matrix above AND enables deletion; naming
# it here makes that combination harmless rather than merely unlikely.
firewall_protected_descriptions:
  - "ansible: anti-lockout HTTPS management"
  - "ansible: anti-lockout SSH management"
  - "ansible: trusted -> management"

firewall_internet_zones:
  - management
  - trusted
  - platform
  - iot
  - iot_vendor
  - iot_backend
  - guest
  - tenant_transit
