---
# The role each hypervisor's automation token holds in place of Administrator
# (CHG-0037). The token (terraform-prov@pve, vault_proxmox_token_*) serves the
# substrate's automation on that node: Packer's template builds, the tenant
# fabric, proxmox_vm's service VMs, vm_identity's survey and shutdown.yml. Each
# privilege is what a call they make requires, per Proxmox VE 9.2's API
# schema and 8.4's code. The node-specific extras (USB mappings, SDN) are
# granted in the node's host_vars, on narrower paths.
#
# Reading a VM's address from its guest agent is VM.GuestAgent.Audit from
# Proxmox VE 9, and VM.Monitor before it, which also allows commands in the
# guest. A node sets proxmox_ve_major; moving it to 9 narrows its role.
proxmox_automation_role:
  id: DeevnetAutomation
  privs: "{{ proxmox_automation_privs + [proxmox_automation_agent_priv] }}"
proxmox_automation_agent_priv: >-
  {{ 'VM.GuestAgent.Audit' if (proxmox_ve_major | int) >= 9 else 'VM.Monitor' }}
proxmox_automation_privs:
  - Datastore.AllocateSpace   # disks, cloud-init drives, clones
  - Datastore.Audit           # read storage and the ISO on local:iso
  - SDN.Use                   # attach a NIC to a bridge or VLAN
  - Sys.Audit                 # task status, node reads
  - VM.Allocate               # create, convert to template, delete
  - VM.Audit                  # VM info, config, pending changes
  - VM.Clone                  # proxmox_vm clones the newest template
  - VM.Config.CDROM           # the install ISO, attached and removed
  - VM.Config.CPU
  - VM.Config.Cloudinit
  - VM.Config.Disk            # includes resize
  - VM.Config.HWType          # SCSI controller, USB devices
  - VM.Config.Memory
  - VM.Config.Network
  - VM.Config.Options         # onboot, startup order, agent, name
  - VM.Console                # Packer types the boot command (PUT sendkey)
  - VM.PowerMgmt              # start, stop, shutdown

# The Fedora DVD ISOs Packer's template build boots from, for each release the
# factory builds, staged into local:iso from the artifact server by
# deevnet.builder's proxmox_node_isos role (site.yml --tags isos, CHG-0037).
proxmox_node_isos:
  - "{{ bootstrap_artifact_server }}/fedora/{{ deevnet_fedora_current.release }}/iso/Fedora-Server-dvd-x86_64-{{ deevnet_fedora_current.release }}-{{ deevnet_fedora_current.build }}.iso"
  - "{{ bootstrap_artifact_server }}/fedora/{{ deevnet_fedora_previous.release }}/iso/Fedora-Server-dvd-x86_64-{{ deevnet_fedora_previous.release }}-{{ deevnet_fedora_previous.build }}.iso"
