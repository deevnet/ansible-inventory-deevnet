# Example vault: every key this vault holds, with its value emptied.
# A new site copies it to vault.yml (scripts/make-empty-vault.sh), fills it in,
# and runs `make vault` before committing. Generated by scripts/vault-examples.py.

---
# Backup (CHG-0039). The private half of the key every backup is encrypted to.
#
# No host holds it. The backup job encrypts to the public half
# (backup_age_recipient, in vars.yml beside this file), so this is read only
# when a backup is restored. Losing it makes every backup written so far
# unreadable, and a new pair starts the set again.
#   age-keygen        (the "public key:" line it prints goes in vars.yml)
vault_backup_age_identity: ""
