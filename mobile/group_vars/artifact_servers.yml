  # =========================================================================
  # SG2218 firmware (dv02acc001p01)
  #
  # Unlike the AP this is ONE hop, not a chain. The switch reports hardware
  # 1.20 and runs 1.20.1 Build 20240115; none of the eight V1.20 builds since
  # (1.20.4 .. 1.20.24) declares a minimum prior version or is flagged
  # irreversible, so it goes straight to current.
  #
  # Mirrored anyway, for the same reason as the AP: the switch carries every
  # wired path on site, the builder's own included. Once it reboots nothing
  # reaches TP-Link until it is back, so the file has to be on hand first.
  #
  # The switch keeps two images and writes the upload into the backup one,
  # so 1.20.1 stays on flash and rollback is a boot-config change - there is
  # no older build to mirror.
  #
  # 1.20.24 recommends Omada Controller 6.2.0 or later.
  #
  # TP-Link publish no checksums; the sha256 is of the bytes mirrored on
  # 2026-09-10. The zip carries SG2218v1_en_1.20.24_[20260509-rel23533]_up.bin,
  # which is what the switch's web UI takes, extracted alongside. TP-Link's
  # page lists it for V1.20 and V1.26 (Vx.x0 = Vx.x6).
  # See docs/runbook/recovery/console-recovery/access-switch.
  - name: "sg2218-fw-1.20.24"
    type: "generic"
    url: "https://static.tp-link.com/upload/firmware/2026/202605/20260529/SG2218(UN)_V1.20_1.20.24%20Build%2020260509.zip"
    dest_subdir: "firmware/sg2218"
    dest_filename: "SG2218_1.20_1.20.24_Build_20260509.zip"
    sha256: "8dc7cf3258acb12ebcda29e1b5ff8b25bfa5951f30d5c5cd38d2de9c6b5658cd"

  # =========================================================================
  # Fedora Server {{ deevnet_fedora_current.release }} (current)
  # All four entries derive from deevnet_fedora_current in group_vars/all.
  # =========================================================================

  # Installer ISO - netinst (small, pulls packages from the install tree)
  - name: "fedora-server-{{ deevnet_fedora_current.release }}-netinst-x86_64"
    type: "fedora_iso"
    iso_url: "{{ deevnet_fedora_mirror }}/{{ deevnet_fedora_current.release }}/Server/x86_64/iso/Fedora-Server-netinst-x86_64-{{ deevnet_fedora_current.release }}-{{ deevnet_fedora_current.build }}.iso"
    checksum_url: "{{ deevnet_fedora_mirror }}/{{ deevnet_fedora_current.release }}/Server/x86_64/iso/Fedora-Server-{{ deevnet_fedora_current.release }}-{{ deevnet_fedora_current.build }}-x86_64-CHECKSUM"
    gpg_key_url: "https://fedoraproject.org/fedora.gpg"
    dest_subdir: "fedora/{{ deevnet_fedora_current.release }}/iso"
    dest_filename: "Fedora-Server-netinst-x86_64-{{ deevnet_fedora_current.release }}-{{ deevnet_fedora_current.build }}.iso"

  # Installer ISO - full DVD (self-contained; consumed by the Packer Proxmox build)
  # Same CHECKSUM file as netinst; sha256sum --ignore-missing tolerates the other name.
  - name: "fedora-server-{{ deevnet_fedora_current.release }}-dvd-x86_64"
    type: "fedora_iso"
    iso_url: "{{ deevnet_fedora_mirror }}/{{ deevnet_fedora_current.release }}/Server/x86_64/iso/Fedora-Server-dvd-x86_64-{{ deevnet_fedora_current.release }}-{{ deevnet_fedora_current.build }}.iso"
    checksum_url: "{{ deevnet_fedora_mirror }}/{{ deevnet_fedora_current.release }}/Server/x86_64/iso/Fedora-Server-{{ deevnet_fedora_current.release }}-{{ deevnet_fedora_current.build }}-x86_64-CHECKSUM"
    gpg_key_url: "https://fedoraproject.org/fedora.gpg"
    dest_subdir: "fedora/{{ deevnet_fedora_current.release }}/iso"
    dest_filename: "Fedora-Server-dvd-x86_64-{{ deevnet_fedora_current.release }}-{{ deevnet_fedora_current.build }}.iso"

  # Netboot kernel + initrd (staged to TFTP root; this is what PXE actually boots)
  - name: "fedora-server-{{ deevnet_fedora_current.release }}-netboot-x86_64"
    type: "netboot_tftp"
    base_url: "{{ deevnet_fedora_mirror }}/{{ deevnet_fedora_current.release }}/Server/x86_64/os/images/pxeboot"
    dest_subdir: "netboot/fedora/{{ deevnet_fedora_current.release }}"
    tftp_dest_subdir: "fedora/{{ deevnet_fedora_current.release }}"

  # Install tree (what Anaconda pulls packages from via inst.repo)
  - name: "fedora-server-{{ deevnet_fedora_current.release }}-install-tree"
    type: "fedora_install_tree"
    rsync_mirrors: "{{ deevnet_fedora_rsync_mirrors }}"
    rsync_path: "releases/{{ deevnet_fedora_current.release }}/Server/x86_64/os/"
    dest_subdir: "fedora/{{ deevnet_fedora_current.release }}/mirror"

  # =========================================================================
  # Fedora Server {{ deevnet_fedora_previous.release }} (previous - kept as fallback)
  # =========================================================================

  - name: "fedora-server-{{ deevnet_fedora_previous.release }}-netinst-x86_64"
    type: "fedora_iso"
    iso_url: "{{ deevnet_fedora_mirror }}/{{ deevnet_fedora_previous.release }}/Server/x86_64/iso/Fedora-Server-netinst-x86_64-{{ deevnet_fedora_previous.release }}-{{ deevnet_fedora_previous.build }}.iso"
    checksum_url: "{{ deevnet_fedora_mirror }}/{{ deevnet_fedora_previous.release }}/Server/x86_64/iso/Fedora-Server-{{ deevnet_fedora_previous.release }}-{{ deevnet_fedora_previous.build }}-x86_64-CHECKSUM"
    gpg_key_url: "https://fedoraproject.org/fedora.gpg"
    dest_subdir: "fedora/{{ deevnet_fedora_previous.release }}/iso"
    dest_filename: "Fedora-Server-netinst-x86_64-{{ deevnet_fedora_previous.release }}-{{ deevnet_fedora_previous.build }}.iso"

  - name: "fedora-server-{{ deevnet_fedora_previous.release }}-netboot-x86_64"
    type: "netboot_tftp"
    base_url: "{{ deevnet_fedora_mirror }}/{{ deevnet_fedora_previous.release }}/Server/x86_64/os/images/pxeboot"
    dest_subdir: "netboot/fedora/{{ deevnet_fedora_previous.release }}"
    tftp_dest_subdir: "fedora/{{ deevnet_fedora_previous.release }}"

