# Artifacts root directory
# Site-agnostic on purpose. The artifact server runs on the roaming builder
# (dv00 - no site), so naming its root after a site would be the same mistake
# ADR-0008 exists to correct.
nginx_artifacts_root: /srv/deevnet-http

# TFTP Staging Configuration
# Enable to copy netboot files to TFTP root (for hosts that are also bootstrap nodes)
artifacts_tftp_staging_enabled: true
artifacts_tftp_staging_root: /srv/tftp
artifacts_tftp_staging_owner: dnsmasq
artifacts_tftp_staging_group: dnsmasq

# Public key for auto-provisioning
artifacts_ssh_keys:
  - name: "a_autoprov_rsa"
    dest_subdir: "keys/ssh"
    dest_filename: "a_autoprov_rsa.pub"
    public_key: "{{ deevnet_autoprov_ssh_key }}"

# Podman artifacts
artifacts_podman_images:
  - name: "omada-controller-5.12"
    upstream_image: "docker.io/mbentley/omada-controller:5.12"
    dest_subdir: "container-images/omada-controller"
    tar_filename: "omada-controller-5.12.tar"
  # The two ways back from 6.3, both started on the 6.1.0.19 data snapshot in
  # /opt/omada-controller-backup - never on the live data. A controller cannot
  # open a database a newer one has upgraded, so an image alone is not a way
  # back. See docs/runbook/recovery/omada-controller-recovery.
  #
  # 6.2.14.11 is the fallback: the mature line (July 2026), and what SG2218
  # 1.20.24 was built against. Rehearsed 2026-09-10 on a copy of the snapshot -
  # it upgraded the database, kept the site, and a_autoprov logged in.
  - name: "omada-controller-6.2"
    upstream_image: "docker.io/mbentley/omada-controller:6.2.14.11"
    dest_subdir: "container-images/omada-controller"
    tar_filename: "omada-controller-6.2.14.11.tar"
  # 6.1 is the last resort: exactly what ran before, if 6.2 fails too.
  - name: "omada-controller-6.1"
    upstream_image: "docker.io/mbentley/omada-controller:6.1"
    dest_subdir: "container-images/omada-controller"
    tar_filename: "omada-controller-6.1.tar"
  # Pinned to the build, not the 6.3 minor tag, for the same reason as the
  # resolver below: what a rebuild restores should be what was verified.
  - name: "omada-controller"
    upstream_image: "docker.io/mbentley/omada-controller:6.3.0.45"
    dest_subdir: "container-images/omada-controller"
    tar_filename: "omada-controller-6.3.0.45.tar"
    latest_symlink: "omada-controller-latest.tar"
  # Tenant authoritative DNS (ADR-0004). Pinned: an unpinned resolver is a
  # surprise waiting for a rebuild.
  - name: "pdns-auth"
    upstream_image: "docker.io/powerdns/pdns-auth-49:4.9.17"
    dest_subdir: "container-images/pdns-auth"
    tar_filename: "pdns-auth-4.9.17.tar"
    latest_symlink: "pdns-auth-latest.tar"
  # Tenant Terraform state store (ADR-0007). Offered, not mandated: a tenant may
  # decline it and keep local state. Pinned for the same reason as the resolver
  # above - the thing that holds every tenant's state should not change under a
  # rebuild.
  - name: "minio"
    upstream_image: "quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z"
    dest_subdir: "container-images/minio"
    tar_filename: "minio-RELEASE.2025-09-07T16-13-09Z.tar"
    latest_symlink: "minio-latest.tar"

# Artifacts that admin hosts (artifact servers) should host under nginx_artifacts_root
artifacts_to_fetch:
  # =========================================================================
  # EAP650-Outdoor firmware (dv02wap001p01)
  #
  # Mirrored because the upgrade is a CHAIN, not a single step, and each hop
  # has to be on hand before the previous one reboots the only AP on site.
  # The unit shipped on 1.0.4 (2023) and every build since declares a minimum
  # prior version:
  #
  #   1.0.4  ->  1.2.5   (no minimum declared)
  #          ->  1.3.3   (minimum 1.2.0; IRREVERSIBLE - TP-Link state a
  #                       downgrade needs their support to undo)
  #          ->  1.3.11  (minimum 1.3.1)
  #
  # TP-Link publish no checksums for these, so the sha256 below is of what was
  # actually mirrored on 2026-09-09, pinned so a later re-fetch is verified
  # against the same bytes rather than against whatever the URL serves next.
  # Each zip carries EAP650-Outdoorv1_<ver>_[<build>]_up_signed.bin - the `v1`
  # matters, it is the hardware match for EAP650-Outdoor(US) v1.0.
  #
  # The .bin inside is what the AP's web UI takes; the zip is what upstream
  # publishes, so the zip is what is declared here.
  # See docs/runbook/recovery/console-recovery/wireless-ap.
  - name: "eap650-outdoor-fw-1.2.5"
    type: "generic"
    url: "https://static.tp-link.com/upload/firmware/2025/202504/20250417/EAP650-Outdoor%201.0_Build%2020250321.zip"
    dest_subdir: "firmware/eap650-outdoor"
    dest_filename: "EAP650-Outdoor_1.0_1.2.5_Build_20250321.zip"
    sha256: "6d2daefec12bd59cd489de5f859a6fdd637b0ed7cc01d8fc03b55dfe1569eccb"

  - name: "eap650-outdoor-fw-1.3.3"
    type: "generic"
    url: "https://static.tp-link.com/upload/firmware/2025/202512/20251204/EAP650-Outdoor%201.0_1.3.3%20Build%2020251111.zip"
    dest_subdir: "firmware/eap650-outdoor"
    dest_filename: "EAP650-Outdoor_1.0_1.3.3_Build_20251111.zip"
    sha256: "1907bc83af426e88150a385ade868b821cd1180bfb38afc67c4fba701e5a07b0"

  - name: "eap650-outdoor-fw-1.3.11"
    type: "generic"
    url: "https://static.tp-link.com/upload/firmware/2026/202607/20260730/EAP650-Outdoor%201.0_1.3.11%20Build%2020260703.zip"
    dest_subdir: "firmware/eap650-outdoor"
    dest_filename: "EAP650-Outdoor_1.0_1.3.11_Build_20260703.zip"
    sha256: "1cdb6cfc7fbc6f73295a6342245e30893f6f2c1da4fcd5b281a5aa5e1e1a0e77"

  # =========================================================================
  # SG2218 firmware (dv02acc001p01)
  #
  # Unlike the AP this is ONE hop, not a chain. The switch reports hardware
  # 1.20 and runs 1.20.1 Build 20240115; none of the eight V1.20 builds since
  # (1.20.4 .. 1.20.24) declares a minimum prior version or is flagged
  # irreversible, so it goes straight to current.
  #
  # Mirrored anyway, for the same reason as the AP: the switch carries every
  # wired path on site, the builder's own included. Once it reboots nothing
  # reaches TP-Link until it is back, so the file has to be on hand first.
  #
  # The switch keeps two images and writes the upload into the backup one,
  # so 1.20.1 stays on flash and rollback is a boot-config change - there is
  # no older build to mirror.
  #
  # 1.20.24 recommends Omada Controller 6.2.0 or later.
  #
  # TP-Link publish no checksums; the sha256 is of the bytes mirrored on
  # 2026-09-10. The zip carries SG2218v1_en_1.20.24_[20260509-rel23533]_up.bin,
  # which is what the switch's web UI takes, extracted alongside. TP-Link's
  # page lists it for V1.20 and V1.26 (Vx.x0 = Vx.x6).
  # See docs/runbook/recovery/console-recovery/access-switch.
  - name: "sg2218-fw-1.20.24"
    type: "generic"
    url: "https://static.tp-link.com/upload/firmware/2026/202605/20260529/SG2218(UN)_V1.20_1.20.24%20Build%2020260509.zip"
    dest_subdir: "firmware/sg2218"
    dest_filename: "SG2218_1.20_1.20.24_Build_20260509.zip"
    sha256: "8dc7cf3258acb12ebcda29e1b5ff8b25bfa5951f30d5c5cd38d2de9c6b5658cd"

  # =========================================================================
  # Fedora Server {{ deevnet_fedora_current.release }} (current)
  # All four entries derive from deevnet_fedora_current in group_vars/all.
  # =========================================================================

  # Installer ISO - netinst (small, pulls packages from the install tree)
  - name: "fedora-server-{{ deevnet_fedora_current.release }}-netinst-x86_64"
    type: "fedora_iso"
    iso_url: "{{ deevnet_fedora_mirror }}/{{ deevnet_fedora_current.release }}/Server/x86_64/iso/Fedora-Server-netinst-x86_64-{{ deevnet_fedora_current.release }}-{{ deevnet_fedora_current.build }}.iso"
    checksum_url: "{{ deevnet_fedora_mirror }}/{{ deevnet_fedora_current.release }}/Server/x86_64/iso/Fedora-Server-{{ deevnet_fedora_current.release }}-{{ deevnet_fedora_current.build }}-x86_64-CHECKSUM"
    gpg_key_url: "https://fedoraproject.org/fedora.gpg"
    dest_subdir: "fedora/{{ deevnet_fedora_current.release }}/iso"
    dest_filename: "Fedora-Server-netinst-x86_64-{{ deevnet_fedora_current.release }}-{{ deevnet_fedora_current.build }}.iso"

  # Installer ISO - full DVD (self-contained; consumed by the Packer Proxmox build)
  # Same CHECKSUM file as netinst; sha256sum --ignore-missing tolerates the other name.
  - name: "fedora-server-{{ deevnet_fedora_current.release }}-dvd-x86_64"
    type: "fedora_iso"
    iso_url: "{{ deevnet_fedora_mirror }}/{{ deevnet_fedora_current.release }}/Server/x86_64/iso/Fedora-Server-dvd-x86_64-{{ deevnet_fedora_current.release }}-{{ deevnet_fedora_current.build }}.iso"
    checksum_url: "{{ deevnet_fedora_mirror }}/{{ deevnet_fedora_current.release }}/Server/x86_64/iso/Fedora-Server-{{ deevnet_fedora_current.release }}-{{ deevnet_fedora_current.build }}-x86_64-CHECKSUM"
    gpg_key_url: "https://fedoraproject.org/fedora.gpg"
    dest_subdir: "fedora/{{ deevnet_fedora_current.release }}/iso"
    dest_filename: "Fedora-Server-dvd-x86_64-{{ deevnet_fedora_current.release }}-{{ deevnet_fedora_current.build }}.iso"

  # Netboot kernel + initrd (staged to TFTP root; this is what PXE actually boots)
  - name: "fedora-server-{{ deevnet_fedora_current.release }}-netboot-x86_64"
    type: "netboot_tftp"
    base_url: "{{ deevnet_fedora_mirror }}/{{ deevnet_fedora_current.release }}/Server/x86_64/os/images/pxeboot"
    dest_subdir: "netboot/fedora/{{ deevnet_fedora_current.release }}"
    tftp_dest_subdir: "fedora/{{ deevnet_fedora_current.release }}"

  # Install tree (what Anaconda pulls packages from via inst.repo)
  - name: "fedora-server-{{ deevnet_fedora_current.release }}-install-tree"
    type: "fedora_install_tree"
    rsync_mirrors: "{{ deevnet_fedora_rsync_mirrors }}"
    rsync_path: "releases/{{ deevnet_fedora_current.release }}/Server/x86_64/os/"
    dest_subdir: "fedora/{{ deevnet_fedora_current.release }}/mirror"

  # =========================================================================
  # Fedora Server {{ deevnet_fedora_previous.release }} (previous - kept as fallback)
  # =========================================================================

  - name: "fedora-server-{{ deevnet_fedora_previous.release }}-netinst-x86_64"
    type: "fedora_iso"
    iso_url: "{{ deevnet_fedora_mirror }}/{{ deevnet_fedora_previous.release }}/Server/x86_64/iso/Fedora-Server-netinst-x86_64-{{ deevnet_fedora_previous.release }}-{{ deevnet_fedora_previous.build }}.iso"
    checksum_url: "{{ deevnet_fedora_mirror }}/{{ deevnet_fedora_previous.release }}/Server/x86_64/iso/Fedora-Server-{{ deevnet_fedora_previous.release }}-{{ deevnet_fedora_previous.build }}-x86_64-CHECKSUM"
    gpg_key_url: "https://fedoraproject.org/fedora.gpg"
    dest_subdir: "fedora/{{ deevnet_fedora_previous.release }}/iso"
    dest_filename: "Fedora-Server-netinst-x86_64-{{ deevnet_fedora_previous.release }}-{{ deevnet_fedora_previous.build }}.iso"

  - name: "fedora-server-{{ deevnet_fedora_previous.release }}-netboot-x86_64"
    type: "netboot_tftp"
    base_url: "{{ deevnet_fedora_mirror }}/{{ deevnet_fedora_previous.release }}/Server/x86_64/os/images/pxeboot"
    dest_subdir: "netboot/fedora/{{ deevnet_fedora_previous.release }}"
    tftp_dest_subdir: "fedora/{{ deevnet_fedora_previous.release }}"

  - name: "fedora-server-{{ deevnet_fedora_previous.release }}-install-tree"
    type: "fedora_install_tree"
    rsync_mirrors: "{{ deevnet_fedora_rsync_mirrors }}"
    rsync_path: "releases/{{ deevnet_fedora_previous.release }}/Server/x86_64/os/"
    dest_subdir: "fedora/{{ deevnet_fedora_previous.release }}/mirror"

  # =========================================================================
  # Other platforms
  # =========================================================================

  # ---------------------------------------------------------
  # Proxmox VE 8.4-1 (bare metal installer, Debian 12 Bookworm based)
  # GPG-verified via SHA256SUMS.bookworm-key.asc (matches bookworm GPG key)
  # ---------------------------------------------------------
  - name: "proxmox-ve-8.4-1"
    type: "proxmox_iso"
    iso_url: "https://enterprise.proxmox.com/iso/proxmox-ve_8.4-1.iso"
    checksum_url: "https://enterprise.proxmox.com/iso/SHA256SUMS"
    signature_url: "https://enterprise.proxmox.com/iso/SHA256SUMS.bookworm-key.asc"
    gpg_key_url: "https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg"
    dest_subdir: "isos/proxmox"
    dest_filename: "proxmox-ve_8.4-1.iso"

  # ---------------------------------------------------------
  # Proxmox VE 9.2-1 (Debian 13 "trixie")
  #
  # Held for the dv02hyp001p01 uplift - dv02hyp001p01 is still on 8.4.1 while dv02hyp002p02 runs 9.2.11 -
  # and so a hypervisor can be reinstalled with no internet.
  #
  # Two keys, deliberately. SHA256SUMS.asc is signed by BOTH the Trixie and the
  # Bookworm release keys, and `gpg --verify` exits non-zero if it cannot check
  # any signature present in the file. Importing only one key fails the artifact
  # on a good signature. Verified: sha256 of proxmox-ve_9.2-1.iso in the signed
  # SHA256SUMS is
  # 4e88fe416df9b527624a175f24c9aa07c714d3332afb1ee3dbf3879573ef2c6c
  # ---------------------------------------------------------
  - name: "proxmox-ve-9.2-1"
    type: "proxmox_iso"
    iso_url: "https://enterprise.proxmox.com/iso/proxmox-ve_9.2-1.iso"
    checksum_url: "https://enterprise.proxmox.com/iso/SHA256SUMS"
    signature_url: "https://enterprise.proxmox.com/iso/SHA256SUMS.asc"
    gpg_key_urls:
      - "https://enterprise.proxmox.com/debian/proxmox-release-trixie.gpg"
      - "https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg"
    dest_subdir: "isos/proxmox"
    dest_filename: "proxmox-ve_9.2-1.iso"

  # ---------------------------------------------------------
  # Pi OS Lite (Trixie, ARM64, 2025-11-24)
  # ---------------------------------------------------------
  - name: "raspios-trixie-arm64-lite-2025-11-24"
    type: "generic"
    url: "https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2025-11-24/2025-11-24-raspios-trixie-arm64-lite.img.xz"
    sha256: "1d448a6e665e1ae8100bc28b35408619ec626a2fddfd6579ec99e7996fa09a56"
    dest_subdir: "pi-images/2025-11-24"
    dest_filename: "2025-11-24-raspios-trixie-arm64-lite.img.xz"

  # ---------------------------------------------------------
  # Pi OS Lite (Bookworm Legacy, ARM64, 2025-11-24)
  # ---------------------------------------------------------
  - name: "raspios-bookworm-arm64-lite-2025-11-24"
    type: "generic"
    url: "https://downloads.raspberrypi.com/raspios_oldstable_lite_arm64/images/raspios_oldstable_lite_arm64-2025-11-24/2025-11-24-raspios-bookworm-arm64-lite.img.xz"
    sha256: "e6a69b5a5a8cd4afc0e9dbdc8404f6fed7c93e0d1796f438e7c780e0eac2d482"
    dest_subdir: "pi-images/2025-11-24"
    dest_filename: "2025-11-24-raspios-bookworm-arm64-lite.img.xz"

