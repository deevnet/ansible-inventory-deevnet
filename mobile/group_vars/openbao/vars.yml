---
# The pre-ADR-0031 pki mount: OpenBao issued the substrate's certificates
# from an intermediate there. Nothing does since CHG-0033; the openbao role
# removes it. Its PKI is the two tenant CAs: the Tenant Device CA
# (pki-tenant-device) and the Tenant Service CA (pki-tenant-service, ADR-0037).
openbao_retired_mounts:
  - pki
