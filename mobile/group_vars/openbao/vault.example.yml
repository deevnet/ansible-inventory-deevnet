# Example vault: every key this vault holds, with its value emptied.
# A new site copies it to vault.yml (scripts/make-empty-vault.sh), fills it in,
# and runs `make vault` before committing. Generated by scripts/vault-examples.py.

---
# OpenBao's bootstrap secrets (ADR-0016 §2). ansible-vault stays the root of
# trust for what OpenBao cannot hold about itself.

# The static seal key: 32 bytes, base64. OpenBao unseals itself with it on every
# start, so anyone holding this key and a copy of the Raft data reads every
# secret. It gets the same care as the vault password.
#   head -c 32 /dev/urandom | base64
vault_openbao_seal_key: ""
vault_openbao_seal_key_id: ""

# Ansible's AppRole, which configures OpenBao after the root token is revoked.
# Written by the openbao role's first run on empty storage, to
# .openbao/dv02idn001v01-init.json on the control node, and moved here before
# that file was deleted. Losing these means OpenBao cannot be administered and
# has to be rebuilt - it happened once already, on 2026-09-17.
vault_openbao_ansible_role_id: ""
vault_openbao_ansible_secret_id: ""

# The recovery key. The static seal means this is never needed to start OpenBao;
# it is what generates a new root token when one is needed, so it is kept and
# not used. One share, threshold one.
vault_openbao_recovery_key: ""
