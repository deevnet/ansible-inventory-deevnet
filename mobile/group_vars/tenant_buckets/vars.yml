---
# The tenant bucket store (ADR-0026 §3, CHG-0068): the second instance of the
# store on the object storage VM, beside the state store. site.yml's "Configure
# the tenant bucket store" play maps these onto the minio role.
#
# On the data disk, not the state disk: a tenant can overrun its bucket quota
# for up to one scanner cycle, and that overrun must never reach state.
# Loopback only, like the state store (group_vars/tenant_state); tenants reach it
# as s3.<site> on 443 through the service proxy.
tenant_buckets_container_name: silo-buckets
tenant_buckets_data_root: /srv/buckets
tenant_buckets_api_port: 9100
tenant_buckets_console_port: 9101

# The Deevnet API's admin actions on this store (CHG-0069): the state store's
# user and policy administration, plus bucket quotas.
tenant_buckets_api_admin_actions:
  - admin:CreateUser
  - admin:DeleteUser
  - admin:GetUser
  - admin:ListUsers
  - admin:CreatePolicy
  - admin:DeletePolicy
  - admin:GetPolicy
  - admin:AttachUserOrGroupPolicy
  - admin:ListUserPolicies
  - admin:SetBucketQuota
  - admin:GetBucketQuota
