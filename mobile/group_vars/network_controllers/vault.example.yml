# Example vault: every key this vault holds, with its value emptied.
# A new site copies it to vault.yml (scripts/make-empty-vault.sh), fills it in,
# and runs `make vault` before committing. Generated by scripts/vault-examples.py.

# The controller's local site Admin that automation logs in as (a_autoprov).
vault_omada_admin_user: ""
vault_omada_admin_password: ""

# Ansible's Open API client (omada-wireless.yml), created by the controller's
# Owner in the UI.
vault_omada_openapi_client_id: ""
vault_omada_openapi_client_secret: ""

# The Deevnet API's OWN Open API client (CHG-0013), separate from the Ansible
# one above. The permission is identical - every PPSK write needs site-wide
# Network Config Page Modify - so this is not about privilege. It is about blast
# radius, independent rotation, and being able to tell the two apart in the
# controller's audit log: revoking the API's client must not stop `make wireless`
# working, and vice versa.
#
# Created by the OWNER in the UI, because an Open API client needs a GLOBAL role
# and a_autoprov is site-scoped (ADR-0009 §5). Global View -> Settings ->
# Platform Integration -> Open API, grant type Client Credentials.
#
vault_omada_api_client_id: ""
vault_omada_api_client_secret: ""

# The controller's Owner account - humans and the web UI only.
#
# Deliberately NOT named vault_omada_admin_*: nothing maps these into a role
# variable, and nothing should. Automation uses the a_autoprov account above,
# which is a local site Admin and can be rotated through the API. This one is
# cloud-registered (registeredRoot), so the local API refuses to change its
# password (-1005) - it can only be changed in the UI or the TP-Link cloud
# account, which is exactly why it must not be what automation depends on.
#
vault_omada_owner_user: ""
vault_omada_owner_password: ""

# AP standalone admin, set at the AP's first login after the CHG-0005 factory
# reset (2026-09-15). Used by net/playbooks/omada-wireless.yml -e omada_adopt=true
# for the controller's start-adopt call. Not the Omada credentials above.
vault_wap_standalone_user: ""
vault_wap_standalone_password: ""
