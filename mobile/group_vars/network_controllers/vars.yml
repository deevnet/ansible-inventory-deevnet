  # Optional customizations
  omada_image_tag: "6.3.0.45"
  omada_env_vars:
    - "TZ=America/New_York"
    - "MANAGE_HTTP_PORT=8088"
    - "MANAGE_HTTPS_PORT=8043"
    - "PORTAL_HTTP_PORT=8088"
    - "PORTAL_HTTPS_PORT=8843"
    - "SHOW_SERVER_LOGS=true"
    - "SHOW_MONGODB_LOGS=false"

  # Omada controller API credentials (references vault).
  #
  # These are the `a_autoprov` account: a LOCAL account with the Admin role,
  # scoped to the dvntm site. It is what every play talks to the controller with,
  # and - unlike the Owner - its password can be changed through the API, so it
  # can actually be rotated.
  omada_admin_user: "{{ vault_omada_admin_user }}"
  omada_admin_password: "{{ vault_omada_admin_password }}"

  # The Owner account lives in the vault as vault_omada_owner_user /
  # vault_omada_owner_password and is deliberately NOT mapped to a role variable
  # here. It is for humans and the web UI. Automation used to run as the Owner;
  # it no longer does, and mapping it back in would undo that. If a play ever
  # genuinely needs Owner rights, reference the vault variable at that play
  # rather than making it the group default.

  # The EAP ACL protocol list meaning "every protocol" (CHG-0029 step 2). The
  # Open API spec defers protocol values to an access guide it does not publish,
  # so this was read back from a rule made in the controller UI with protocols
  # "All" on 6.3.0.45, and that rule deleted. Used by the client isolation ACLs.
  omada_acl_protocols_all: [256]

  # --- TLS from the site CA (ADR-0030, CHG-0032) -------------------------------
  # Off until CHG-0032's Omada step; then the controller serves a certificate
  # from OpenBao through the image's /cert mount. Used on the CONTROL NODE.
  omada_tls_enabled: true
  omada_openbao_addr: "https://{{ hostvars[groups['openbao'] | first].env.interfaces.eth0.ip }}:8200"
  omada_openbao_ca_local: "{{ playbook_dir }}/../.openbao/{{ groups['openbao'] | first }}-listener.pem"
  # Ansible's own AppRole, read across from the host that holds it.
  omada_openbao_ansible_role_id: "{{ hostvars[groups['openbao'] | first].vault_openbao_ansible_role_id | default('') }}"
  omada_openbao_ansible_secret_id: "{{ hostvars[groups['openbao'] | first].vault_openbao_ansible_secret_id | default('') }}"
