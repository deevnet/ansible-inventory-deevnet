---
# Topic permissions are NOT here any more (CHG-0017).
#
# `mqtt_acls` used to name what `lightd` and `lp-stand-01` could publish and
# subscribe to, and the `mosquitto` role rendered it. Both of those are gone:
# the broker is VerneMQ, which reads its accounts from its own database, and a
# TENANT now declares its own topic permissions as `deevnet_iot_broker_account`
# in its Terraform (ADR-0012 §3, §10; CHG-0016).
#
# That is the point of the move, not a side effect. A tenant's permissions
# belong to the tenant, so a rebuilt tenant restores them from its own state
# and the substrate never has to hold a copy that can drift.
#
# The API writes the `<tenant>/` prefix itself, which is what confines a tenant
# to its own topics - so the patterns a tenant declares are relative, and the
# absolute form here would not even be accepted now.

# OpenBao, for the broker's TLS certificate (ADR-0016, CHG-0015).
#
# The broker serves TLS only, so without these it has no listener at all and
# the role refuses to start rather than come up serving nothing.
#
# Both are used on the CONTROL NODE: every OpenBao call in the vernemq role is
# delegated to localhost, so the messaging VM needs no path to OpenBao and
# none is opened for it. IoT Backend reaching the substrate's secret store
# would be a poor trade for a certificate that can be handed to it instead.
#
# groups['openbao'] rather than groups['tenant_dns'], which deevnet_api uses
# for the same value. They resolve to the same host today because PowerDNS and
# OpenBao share the identity VM, but only one of those names means "where the
# secret store is".
vernemq_openbao_addr: "https://{{ hostvars[groups['openbao'] | first].env.interfaces.eth0.ip }}:8200"
vernemq_openbao_ca_local: "{{ playbook_dir }}/../.openbao/{{ groups['openbao'] | first }}-listener.pem"

# Ansible's own AppRole, read across from the host that holds it.
#
# vault_openbao_ansible_role_id lives in group_vars/openbao/vault.yml, so it is
# visible only to members of the openbao group - and this host is not one, nor
# should it be. The role's default reads the bare variable, which is right for
# a host inside that group and empty everywhere else; reaching through hostvars
# is how deevnet_api solves the same problem, and it stays in inventory rather
# than the role so the role does not have to know what the group is called.
vernemq_openbao_ansible_role_id: "{{ hostvars[groups['openbao'] | first].vault_openbao_ansible_role_id | default('') }}"
vernemq_openbao_ansible_secret_id: "{{ hostvars[groups['openbao'] | first].vault_openbao_ansible_secret_id | default('') }}"


# --- The broker account writer (ADR-0012 §3, §7; CHG-0016) --------------------
# How a tenant's MQTT account reaches the broker without the broker's auth
# database being reachable from the network.
#
# The database is published to 127.0.0.1 only. The Deevnet API opens one SSH
# connection to this host, sshd runs one program as a forced command, and that
# program writes the account over the loopback port. The API never speaks to
# the database and no database port is open anywhere.

# The API's own public key. Its private half is
# vault_deevnet_api_broker_writer_key in group_vars/deevnet_api/vault.yml.
#
# Declaring this is what installs the capability: the role installs no binary,
# no account and no authorized_keys entry while it is empty. You cannot get the
# writer without naming who may use it.
vernemq_writer_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIhmewUa90HUsiEMhXeVheXNO5yXBUHNXiA2DVYl47it deevnet-api broker account writer (CHG-0016)"

# Pinned in authorized_keys with from=, so the key is unusable from anywhere
# else. Belt to the firewall's braces: it survives a firewall mistake, and it
# is the one restriction that travels with the key rather than with the host.
vernemq_writer_from: "{{ hostvars[groups['deevnet_api'] | first].env.interfaces.eth0.ip }}"

# --- Restricting sshd on this host -------------------------------------------
# `iot -> iot_backend` is a zone-level pass (group_vars/all/firewall), so every
# device on VLAN 30 can reach port 22 here. That predates the writer and is
# worth closing on its own merits; adding a key that writes broker accounts
# makes it worth closing now.
#
# This is a firewalld rich rule on the host, filtering host INPUT traffic -
# which is the one path PROVEN to work here. The same rule does NOTHING to a
# published container port, because publishing is DNAT plus forward and never
# reaches the INPUT chain (CHG-0016). That asymmetry is why the database is
# bound to loopback instead of being filtered.
#
# Zone policy and host policy are doing different jobs, and both are needed:
# the router decides which segments may reach this host at all, and this
# decides who may reach one service on it. See standards/network-segmentation,
# "Reachability and Permission".
vernemq_ssh_restrict: true

# The control node MUST be in this list. Ansible reaches this host over exactly
# the port being restricted, so leaving it out locks the automation out and
# costs a console session to undo - the role asserts it rather than trusting
# whoever edits this file.
#
# vernemq_ssh_control_node is NOT set here. The role defaults it to the address
# this host sees Ansible arrive from, which is the address the assert is really
# about; naming one here would be inventory's belief about a route rather than
# the route. Today that value is 10.20.99.95, checked on the host.
vernemq_ssh_allowed_sources:
  # The control node, by the value the role derived rather than an address
  # repeated here.
  - "{{ vernemq_ssh_control_node }}"
  # Management, so a rebuilt or additional Builder still reaches this host
  # without a firewall edit. Management already passes to iot_backend at the
  # router, so this grants nothing the zone policy does not already allow.
  - "{{ deevnet_vlans.management.subnet }}"
  # Operator laptops on Trusted, which the zone policy also already passes.
  - "{{ deevnet_vlans.trusted.subnet }}"
  # The Deevnet API, which is the whole point: the writer's key is useless
  # without a path to sshd.
  - "{{ vernemq_writer_from }}/32"
