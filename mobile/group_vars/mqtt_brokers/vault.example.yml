# Example vault: every key this vault holds, with its value emptied.
# A new site copies it to vault.yml (scripts/make-empty-vault.sh), fills it in,
# and runs `make vault` before committing. Generated by scripts/vault-examples.py.

---
# VerneMQ broker secrets (ADR-0012 §8, CHG-0015).
#
# Generated 2026-09-20 with a CSPRNG. None of these has ever existed in
# plaintext outside this file and the encrypted copy beside it.

# Erlang distribution's ONLY authentication between cluster members. The stock
# value is 'vmq', which is why this is not it. It is set now rather than when a
# second node appears, because changing it on a node that already holds state
# is not something vmq-admin exposes a command for.
vault_vernemq_cookie: ""

# PostgreSQL superuser for the auth database. Used by the role to create the
# schema and the two roles below, and by nothing at runtime.
vault_vernemq_db_admin_password: ""

# The BROKER's credential. SELECT on vmq_auth_acl and nothing else: a broker
# that could write its own ACLs could grant itself anything if it were ever
# compromised (ADR-0012 open question 5).
vault_vernemq_db_reader_password: ""

# The Deevnet API's credential, which provisions accounts. The API is given
# this separately when CHG-0016 puts it in the API's own configuration.
vault_vernemq_db_writer_password: ""

# The log bridge's broker account (ADR-0027 §4, CHG-0021). The one account on
# this broker the Deevnet API does not write: it subscribes to EVERY tenant's
# reserved log level, so no tenant prefix confines it and the API's account
# writer refuses it by design. The `vernemq` role writes the row; the
# `log_bridge` role hands the same value to the bridge, and the two disagreeing
# shows up as a broker that refuses the connection.
#   openssl rand -hex 24
vault_vernemq_bridge_password: ""
