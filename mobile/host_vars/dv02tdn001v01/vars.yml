# Tenant-facing management services host.
#
# A shared host for substrate services that tenants consume, not a DNS
# appliance. PowerDNS (ADR-0004) is its first service; others land beside it,
# each with its own CNAME so a service can move hosts without changing what
# consumers reference.
#
# The name describes audience, not ownership - the same convention as the
# tenant_transit / tenant_underlay VLANs of ADR-0002, which are substrate-owned
# segments named for the tenants they carry.
#
# Substrate-facing management services (observability, automation, access) are
# deliberately kept off this host. Their change cadence is much higher, and a
# restart there must not take tenant name resolution with it.

infrastructure:
  form: vm
  interfaces:
    eth0:
      # Derived from the VMID, not invented - see identity.yml beside this file
      # and docs/standards/mac-naming. The DHCP reservation and the A record
      # both key off this value, so a rebuilt VM keeps its identity.
      #
      # Held here rather than inherited from a group because Ansible does not
      # hash-merge: a group-level `infrastructure` dict would be replaced whole
      # by this one, and opnsense_dhcp would silently stop writing a
      # reservation - gather_hosts.yml skips a host whose interface is missing
      # from `infrastructure`, without raising anything.
      #
      # Defaulted so this file still parses before the identity is allocated.
      mac: "{{ deevnet_assigned_mac | default('') }}"

env:
  role: tenant-mgmt
  interfaces:
    eth0:
      ip: 10.20.99.30
      purpose: mgmt
      segment: management
      dns:
        host_a_record: true
        dhcp_reservation: true
        # One CNAME per service endpoint. Consumers reference these, never the
        # host name, so a service can be moved without touching them.
        cnames:
          - tdns

# Where the VM comes from. Cloned by deevnet.mgmt.proxmox_vm on dv02hyp001p01.
#
# The template is matched by name prefix rather than by VMID: Proxmox assigns
# the next free ID on every image-factory rebuild, so a pinned ID goes stale.
mgmt_vm:
  hypervisor: dv02hyp001p01
  node: dv02hyp001p01
  # Allocated once by deevnet.mgmt playbooks/vm-identity.yml and held in
  # identity.yml beside this file. The VM keeps this ID across rebuilds so the
  # hypervisor's own view of it is stable. Unrelated to the template's ID,
  # which Proxmox reassigns on every image-factory rebuild.
  #
  # This is also the source of the MAC, and so of the DHCP reservation and the
  # address. Changing it is a renumbering, not a resize. 0 means "not yet
  # allocated" and is what the allocator looks for.
  vmid: "{{ deevnet_assigned_vmid | default(0) }}"
  template_prefix: "fedora-server-"
  storage: local-lvm-big-thin
  cores: 2
  memory: 2048
