infrastructure:
  form: hv
  interfaces:
    eth0:
      mac: "d8:9e:f3:7d:94:c4"

env:
  interfaces:
    eth0:
      ip: 10.20.99.21
      purpose: mgmt
      segment: management
      wol: true
      dns:
        host_a_record: true
        dhcp_reservation: true
        cnames:
          - pve

# The PVE node name on this hypervisor. Declared rather than assumed: the
# vm-identity allocator surveys every host in `hypervisors` for VMIDs in use,
# and cannot infer a node name from another host's mgmt_vm block.
proxmox_node: dv02hyp001p01
proxmox_token_id: "{{ vault_proxmox_token_id }}"
proxmox_token_secret: "{{ vault_proxmox_token_secret }}"

# --- Bridge (ADR-0013, CHG-0008) ----------------------------------------------
# Consumed by deevnet.net.proxmox_node_network, and only ever with
# `--tags interfaces`. The domain VMs tag their NIC onto Platform (25) and IoT
# Backend (35), so vmbr0 is VLAN-aware - the configuration Proxmox documents,
# and the one dv02hyp002p02 already uses. Until CHG-0008 it was a plain bridge,
# set by hand.
#
# Bridge only. No VLAN sub-interfaces, and management keeps its untagged
# address and the default route: this node carries no tenant fabric, so the
# role's packages, mgmt-routing, default-route and tenant-egress tags do not
# apply here.
proxmox_node_network:
  bridge:
    name: vmbr0
    vlan_aware: true
    vids: "2-4094"

# --- Install disk and data-disk storage (rebuild) ------------------------------
# Read on the node 2026-09-14. Consumed by the image factory's ISO build
# (PVE_DISK_SERIAL) and by deevnet.builder's proxmox_node_storage; the order is
# in runbook/building-recovery/build-management-plane.
#
# The OS disk, a Samsung PM871b 512GB. This is the udev ID_SERIAL the Proxmox
# installer filters on - the /dev/disk/by-id/ata-* name without its prefix - not
# the short serial lsblk prints. The installer must never choose for itself: the
# other disk holds every VM.
proxmox_install_disk_serial: "SAMSUNG_SSD_PM871b_M.2_2280_512GB_S3TZNB0K409229"

# The data disk, a Crucial BX500 2TB with one partition, volume group vgbigdata.
# Recorded as it is, not as it should be - see the Hypervisor Storage roadmap.
# What the installer builds on the OS disk (local, local-lvm) is not listed.
proxmox_node_storage:
  volume_groups:
    - name: vgbigdata
      device: /dev/disk/by-id/ata-CT2000BX500SSD1_2328E6EDA04B-part1
  thin_pools:
    - vg: vgbigdata
      name: bigthin
      size: 1.07t
  storages:
    # The Fedora template and the management VMs.
    - id: local-lvm-big-thin
      type: lvmthin
      vgname: vgbigdata
      thinpool: bigthin
      content: [images, rootdir]
    # Thick volumes, used by VM 104 (vdvntm-winox, not in inventory).
    - id: local-lvm-big
      type: lvm
      vgname: vgbigdata
      content: [images, rootdir]
