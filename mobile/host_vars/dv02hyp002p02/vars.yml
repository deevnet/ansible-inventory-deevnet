infrastructure:
  form: hv
  interfaces:
    eth0:
      mac: "54:bf:64:87:ca:eb"

env:
  interfaces:
    eth0:
      ip: 10.20.99.22
      purpose: mgmt
      segment: management
      wol: true
      dns:
        host_a_record: true
        dhcp_reservation: true
        cnames:
          - pve2

proxmox_node: dv02hyp002p02
proxmox_token_id: "{{ vault_proxmox_token_id }}"
proxmox_token_secret: "{{ vault_proxmox_token_secret }}"

# --- Tenant fabric attachment (ADR-0001 / ADR-0002) ---------------------------
# Consumed by deevnet.net.proxmox_node_network. Kept out of env.interfaces on
# purpose: ansible_host, the DNS A record and the DHCP reservation are all
# derived from that structure, and none of them should follow these.
#
# dv02hyp002p02 has a single NIC, so management, the tenant transit segment and the
# fabric underlay all ride eno2 as VLAN sub-interfaces of a VLAN-aware vmbr0.
proxmox_node_network:
  bridge:
    name: vmbr0
    vlan_aware: true
    vids: "2-4094"

  # Management keeps its address but gives up the default route - the data
  # plane must not ride the management segment. Reachability from other VLANs
  # is preserved by proxmox_mgmt_routing below, not by a gateway here.
  mgmt:
    interface: vmbr0
    cidr: "10.20.99.22/24"
    gateway: null

  vlans:
    - interface: "vmbr0.{{ deevnet_vlans.tenant_transit.vlan_id }}"
      cidr: "10.20.50.22/24"
      # dv02hyp002p02's default route. Tenant egress leaves here, SNATed by the fabric
      # exit node, so the core router only ever sees this address.
      gateway: "{{ deevnet_vlans.tenant_transit.gateway }}"
      comment: "tenant fabric transit to perimeter"

    - interface: "vmbr0.{{ deevnet_vlans.tenant_underlay.vlan_id }}"
      cidr: "10.20.51.22/24"
      # No gateway: VTEP-to-VTEP transport only. Carries nothing until a
      # second fabric member exists; defined now so adding one is additive.
      gateway: null
      comment: "tenant fabric underlay (VTEP transport)"

# Source-based routing for the management address. Anything *sourced from*
# 10.20.99.22 is answered out vmbr0 whatever its destination, so the Proxmox
# UI stays directly reachable from any VLAN with no jump host. Forwarded
# tenant traffic is not sourced from this address, so it still takes the
# default route out transit and the perimeter is preserved.
proxmox_mgmt_routing:
  enabled: true
  table: 100
  priority: 100

# Fabric identity. ADR-0001 requirement #4 - a real VTEP loopback now, even
# with no peers, so gaining a member later is "add a neighbour" rather than
# "invent an underlay after the fact".
tenant_fabric:
  id: tfab
  loopback: "10.20.255.2"
  asn: 65020
  underlay_interface: "vmbr0.{{ deevnet_vlans.tenant_underlay.vlan_id }}"

# Tenant egress (ADR-0003). Two things Proxmox will not do for an exit node:
# forward on the transit interface, and put a default route inside each tenant
# VRF. Without the first, tenant return traffic is dropped on arrival; without
# the second, tenant traffic falls through to the node's main routing table and
# reaches the management VLAN on-link, unSNATed, without passing the perimeter.
#
# tenants lists the SDN zone IDs the fabric carries - the same names allocated
# in the tenant factory's TENANTS.md. The role fails if one of them has no VRF
# on the node, so the two cannot drift silently.
#
# Derived from the site tenant registry (group_vars/all/tenants.yml) rather than
# restated here. Tenant DNS (ADR-0004) consumes the same registry, so egress and
# naming cannot disagree about which tenants exist.
proxmox_tenant_egress:
  enabled: true
  tenants: "{{ deevnet_tenants | map(attribute='name') | list }}"
  # Set true once the egress agent runs here (ADR-0015 §7): the per-tenant FRR
  # file becomes the agent's, rendered from the Deevnet API rather than from
  # this list. The forwarding sysctl and the transit interface stay with the
  # proxmox_node_network role either way.
  agent_managed: false

# The tenant egress agent (deevnet.net tenant_egress_agent). It reads the VRF
# list from the API with a token scoped to that one route, so this hypervisor
# holds no operator credential.
#
# OFF until vault_deevnet_egress_agent_token exists: the role refuses to run
# without it. Add it with the API's DEEVNET_AGENT_TOKEN, then run
# playbooks/tenant-egress-agent.yml and set agent_managed above.
tenant_egress_agent_api_url: "https://api.{{ deevnet_substrate }}.{{ deevnet_root_domain }}:8080"
# Fetched by the deevnet.mgmt openbao role. Anchored on the inventory rather
# than the playbook, so it resolves the same from any collection.
tenant_egress_agent_ca_src: "{{ inventory_dir }}/../../ansible-collection-deevnet.mgmt/.openbao/site-ca.pem"
