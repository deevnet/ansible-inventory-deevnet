---
# The temporary builder for repaving the Builder: a full peer of dv00bld001p01 -
# builder, artifact server and PXE/TFTP host. Active again since CHG-0091
# (2026-11), after being inactive under CHG-0088.
#
# Installed by PXE from the Builder with the builder kickstart
# (builder-node-<release>.ks), then configured by deevnet.builder site.yml - the
# same path the hardware Builder takes when it is repaved, so building this VM
# rehearses that path. It was once cloned from the image-factory template; the
# kickstart's single-disk layout (/, /home, swap, /srv) replaces the clone's
# separate data disk.

infrastructure:
  form: vm
  interfaces:
    eth0:
      # Derived from the VMID, not invented - see identity.yml beside this file
      # and docs/standards/mac-naming. This NIC is one we create, so it is an
      # "Assigned" MAC and must come out of the 02:de:20 namespace; the
      # bc:24:11: address this host used to declare was a Proxmox-generated one
      # that only ever applied to a guest that no longer exists.
      #
      # Held here rather than in a group because Ansible does not hash-merge: a
      # group-level `infrastructure` dict would be replaced whole by this one and
      # opnsense_dhcp would silently stop writing a reservation.
      mac: "{{ deevnet_assigned_mac | default('') }}"

env:
  role: provisioner
  interfaces:
    eth0:
      ip: 10.20.99.97
      # gateway/prefix/dns are required because this host is in `builder`, so the
      # base role configures the interface statically. The Kea reservation below
      # pins the same address for the DHCP lease the guest takes on first boot,
      # before base has ever run - the two agree by construction, both deriving
      # from this one declaration.
      gateway: 10.20.99.1
      prefix: 24
      dns_servers: "10.20.99.1"
      dns_search: "mobile.deevnet.net deevnet.net"
      purpose: mgmt
      segment: management
      dns:
        host_a_record: true
        dhcp_reservation: true
        # Empty between repaves. `artifacts` and `pxe` move here while the
        # Builder is repaved (Repave the Builder, Step 2): moving a service
        # CNAME is how you cut over, and `pxe` also moves the subnet's
        # next-server.
        cnames: []
        pxe_boot:
          tftp_server: "10.20.99.95"
          # grubx64.efi, not pxelinux.0: this guest boots OVMF and the kickstart
          # lays out a UEFI system only (/boot/efi, no biosboot). See
          # dv02bld002v01 and PXE-TROUBLESHOOTING.md: a per-host Kea reservation
          # overrides the subnet's boot file.
          boot_file: "grubx64.efi"

# Created empty by deevnet.mgmt roles/proxmox_vm (source: pxe) on dv02hyp001p01,
# then installed over the network by anaconda: no template, no cloud-init, no
# static_ip - it installs on its DHCP reservation and base makes the address
# static afterwards (runbook: Build a Management-Hypervisor VM, Approach B).
mgmt_vm:
  source: pxe
  hypervisor: dv02hyp001p01
  node: dv02hyp001p01
  # Last of the management VMs: it runs terraform against the state store and
  # resolves tenant names, so both of its dependencies start ahead of it.
  startup: "order=30,down=60"
  # Allocated once by deevnet.mgmt playbooks/vm-identity.yml and held in
  # identity.yml beside this file. Changing it is a renumbering, not a resize.
  vmid: "{{ deevnet_assigned_vmid | default(0) }}"
  storage: local-lvm-big-thin
  cores: 4
  memory: 6144
  # One disk; the builder-node kickstart lays it out as /boot + ESP, / 50G,
  # /home 60G, swap 16G and /srv the rest (~190G): the artifact mirror (~30G),
  # the checkouts, and room to carry the Builder's /srv off before its repave.
  # The kickstart's floor is about 128 GiB.
  os_disk_size: 320
