---
# THROWAWAY (CHG-0037 Step 5). A test host for proxmox_vm's empty-VM mode
# (mgmt_vm.source: pxe): the role creates it empty, it installs over the
# network from the builder-node kickstart, and it boots from its disk after.
# Removed, with its reservation, record and GRUB config, once that is proven.

infrastructure:
  form: vm
  interfaces:
    eth0:
      # Derived from the VMID by the allocator - see identity.yml beside this
      # file and docs/standards/mac-naming.
      mac: "{{ deevnet_assigned_mac | default('') }}"

env:
  role: builder
  interfaces:
    eth0:
      ip: 10.20.99.98
      purpose: mgmt
      segment: management
      dns:
        host_a_record: true
        dhcp_reservation: true
        cnames: []
        pxe_boot:
          tftp_server: "10.20.99.95"
          # The guest boots OVMF, so the firmware fetches a UEFI binary.
          boot_file: "grubx64.efi"

mgmt_vm:
  source: pxe
  hypervisor: dv02hyp001p01
  node: dv02hyp001p01
  vmid: "{{ deevnet_assigned_vmid | default(0) }}"
  storage: local-lvm-big-thin
  cores: 2
  memory: 4096
  # The builder-node kickstart needs about 88 GiB.
  os_disk_size: 100
  # A test host does not come back with the hypervisor.
  onboot: false
