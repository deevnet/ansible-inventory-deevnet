---
# Tenant observability VM (ADR-0013 §1, §5).
#
# Tenant-shared logs and metrics. On Platform, so tenants reach it over
# tenant_transit -> platform, which is already declared. Kept apart from
# substrate observability (dv02sob001v01): different audience, different
# segment, different class of host.
#
# Built empty: the tooling is not chosen yet.

infrastructure:
  form: vm
  interfaces:
    eth0:
      # Derived from the VMID by the allocator - see identity.yml beside this file.
      mac: "{{ deevnet_assigned_mac | default('') }}"

env:
  role: tenant-observability
  interfaces:
    eth0:
      ip: 10.20.25.22
      purpose: platform
      segment: platform
      dns:
        host_a_record: true
        # No reservation: Platform has no DHCP pool. See dv02prv001v01.
        dhcp_reservation: false
        cnames: []

mgmt_vm:
  hypervisor: dv02hyp001p01
  node: dv02hyp001p01
  startup: "order=50,up=0,down=60"
  vmid: "{{ deevnet_assigned_vmid | default(0) }}"
  template_prefix: "fedora-server-"
  storage: local-lvm-big-thin
  cores: 2
  memory: 2048

  vlan_tag: 25
  static_ip: 10.20.25.22/24
  static_gateway: 10.20.25.1
  nameserver: 10.20.25.1
