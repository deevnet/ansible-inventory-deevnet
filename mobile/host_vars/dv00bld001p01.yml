infrastructure:
  form: ph
  interfaces:
    # CHG-0092: the cables were swapped so the management segment is on the
    # NIC the firmware network-boots from (..:59); the other is now upstream.
    eth0:
      mac: "c8:ff:bf:06:5a:59"
    eth1:
      mac: "c8:ff:bf:06:5a:5a"
    wifi:
      mac: "1c:79:2d:fc:5f:d6"

env:
  role: provisioner
  interfaces:
    eth0:
      ip: 10.20.99.95
      gateway: 10.20.99.1
      prefix: 24
      dns_servers: "10.20.99.1"
      dns_search: "mobile.deevnet.net deevnet.net"
      purpose: mgmt
      segment: management
      wol: true
      routes:
        - "10.20.0.0/16 10.20.99.1"
        - "10.10.0.0/16 10.20.99.1"
      dns:
        host_a_record: true
        dhcp_reservation: true
        cnames:
          - artifacts
          - pxe
        # No pxe_boot: the Builder's own network boot is offered no boot file,
        # so it times out and the firmware boots the disk (CHG-0092). A repave
        # adds it, pointing at the temporary builder, for the install only.
    eth1:
      ip: dhcp
      purpose: transit
      wol: true
    wifi:
      ip: null
      purpose: wan
