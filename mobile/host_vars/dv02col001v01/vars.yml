---
# Observability collection VM (ADR-0023 §1).
#
# Collects what cannot push: vmagent scrapes substrate targets and remote-writes
# to the store (dv02obs001v01). It stores nothing itself. On management because
# management reaches every zone, so a scraper here reaches every target over
# rules that already exist, and nothing needs a path into management.
#
# Replaced dv02sob001v01 in CHG-0018. Built empty: its tooling is ADR-0023's
# change, not CHG-0018's.

infrastructure:
  form: vm
  interfaces:
    eth0:
      # Derived from the VMID by the allocator - see identity.yml beside this file.
      mac: "{{ deevnet_assigned_mac | default('') }}"

env:
  role: observability-collection
  interfaces:
    eth0:
      ip: 10.20.99.41
      purpose: mgmt
      segment: management
      dns:
        host_a_record: true
        dhcp_reservation: true
        cnames: []

mgmt_vm:
  hypervisor: dv02hyp001p01
  node: dv02hyp001p01
  # Last: it observes the others, and nothing waits for it.
  startup: "order=50,up=0,down=60"
  vmid: "{{ deevnet_assigned_vmid | default(0) }}"
  template_prefix: "fedora-server-"
  storage: local-lvm-big-thin
  cores: 2
  memory: 2048
