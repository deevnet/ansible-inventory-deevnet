all:
  children:

    infrastructure:
      children:

        network:
          children:
            routers:
              hosts:
                dv02edg001p01: {}
                dv02cor002p01: {}
                dv02cor001v01: {}

            dns_servers:
              hosts:
                dv02cor002p01: {}

            dhcp_servers:
              hosts:
                dv02cor002p01: {}

            switches:
              hosts:
                dv02acc001p01: {}

            aps:
              hosts:
                dv02wap001p01: {}

        compute:
          children:
            hypervisors:
              hosts:
                dv02hyp001p01: {}
                dv02hyp002p02: {}

            pis:
              hosts:
                dv02rpi001p01: {}
                dv02rpi002p01: {}
                dv02rpi003p01: {}
                dv02rpi004p01: {}

        storage:
          hosts: {}

        control_plane:
          hosts:
            dv02bld001v01: {}
            dv02bld002v01: {}

        # Extended management services on the management hypervisor (dv02hyp001p01).
        # Split by audience: tenant-facing services here, substrate-facing
        # ones on their own host when they arrive.
        #
        # Membership means "a management-plane VM whose identity is allocated"
        # (VMID -> MAC -> DHCP reservation), NOT "cloned from a template". The
        # vm_identity allocator scans exactly this group, and site.yml decides
        # per host whether proxmox_vm applies - dv02bld002v01 is PXE-built
        # and declares an identity only.
        management_plane:
          hosts:
            dv02tdn001v01: {}
            dv02tst001v01: {}
            dv02bld001v01: {}
            dv02bld002v01: {}

        oob_management:
          hosts:
            dv00bld001p01: {}

        edge_devices:
          hosts:
            dv02bgw001e01: {}
            # examples later:
            # jetson-em01: {}
            # mabell-em02: {}
            # console-pi05: {}

    # --- Functional / intent-based groupings (orthogonal) ---
    builder:
      hosts:
        dv00bld001p01: {}
        dv02bld001v01: {}
        dv02bld002v01: {}

    workstations:
      hosts:
        dv00bld001p01: {}
        dv02bld001v01: {}

    artifact_servers:
      hosts:
        dv00bld001p01: {}
        dv02bld001v01: {}

    bootstrap_nodes:
      hosts:
        dv00bld001p01: {}
        dv02bld001v01: {}

    network_controllers:
      hosts:
        dv00bld001p01: {}

    # Tenant authoritative DNS (ADR-0004). Kept as its own functional group
    # even though the host is shared: the powerdns role and the Unbound
    # delegation target this group, so moving the service to a dedicated host
    # later is a one-line change here.
    #
    # Deliberately NOT in dns_servers - that group is the core router and
    # drives playbooks/opnsense.yml.
    tenant_dns:
      hosts:
        dv02tdn001v01: {}

    # Terraform state store for tenants (ADR-0007). Its own group for the same
    # reason tenant_dns is: the service can move to another host by editing this
    # list, and tenants reach it by the `tfstate` name rather than by address.
    tenant_state:
      hosts:
        dv02tst001v01: {}

    # VyOS routers for vyos-site.yml playbook
    vyos_routers:
      hosts:
        dv02cor001v01: {}
