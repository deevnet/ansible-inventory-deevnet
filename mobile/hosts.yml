all:
  children:

    infrastructure:
      children:

        network:
          children:
            routers:
              hosts:
                dv02edg001p01: {}
                dv02cor002p01: {}

            dns_servers:
              hosts:
                dv02cor002p01: {}

            dhcp_servers:
              hosts:
                dv02cor002p01: {}

            switches:
              hosts:
                dv02acc001p01: {}

            aps:
              hosts:
                dv02wap001p01: {}

        compute:
          children:
            hypervisors:
              hosts:
                dv02hyp001p01: {}
                dv02hyp002p02: {}

            # The hypervisor tenants land on: the fabric's member, and so its
            # exit node. Its own group because the tenant egress agent targets
            # it (ADR-0015 §7), and because a second member changes this list
            # and nothing else.
            tenant_hypervisors:
              hosts:
                dv02hyp002p02: {}

            pis:
              hosts:
                dv02rpi001p01: {}
                dv02rpi002p01: {}
                dv02rpi003p01: {}
                dv02rpi004p01: {}

        storage:
          hosts: {}

        control_plane:
          hosts:
            dv02bld001v01: {}
            dv02bld002v01: {}

        # Domain VMs on the management hypervisor (dv02hyp001p01), each on exactly
        # one segment with its functions as containers (ADR-0013), plus the
        # provisioner VMs.
        #
        # Membership means "a management-plane VM whose identity is allocated"
        # (VMID -> MAC -> DHCP reservation), NOT "cloned from a template". The
        # vm_identity allocator scans exactly this group, and site.yml decides
        # per host whether proxmox_vm applies - dv02bld002v01 is PXE-built
        # and declares an identity only.
        management_plane:
          hosts:
            dv02bld001v01: {}
            dv02bld002v01: {}
            dv02idn001v01: {}   # identity - Platform (25)
            dv02prv001v01: {}   # provisioning - Platform (25)
            dv02nms001v01: {}   # network management - management (99)
            dv02msg001v01: {}   # device messaging - IoT Backend (35)
            dv02col001v01: {}   # observability collection - management (99)
            dv02obs001v01: {}   # observability store - Platform (25)

        oob_management:
          hosts:
            dv00bld001p01: {}

        edge_devices:
          hosts:
            dv02bgw001e01: {}
            # examples later:
            # jetson-em01: {}
            # mabell-em02: {}
            # console-pi05: {}

    # --- Functional / intent-based groupings (orthogonal) ---
    builder:
      hosts:
        dv00bld001p01: {}
        dv02bld001v01: {}
        dv02bld002v01: {}

    workstations:
      hosts:
        dv00bld001p01: {}
        dv02bld001v01: {}

    artifact_servers:
      hosts:
        dv00bld001p01: {}
        dv02bld001v01: {}

    bootstrap_nodes:
      hosts:
        dv00bld001p01: {}
        dv02bld001v01: {}

    # The site's Omada controller: a container in the network management VM
    # (ADR-0013 §7), configured by deevnet.mgmt's omada_controller role.
    #
    # The Builder's controller is a cold fallback. Put dv00bld001p01 back in this
    # group only while dv02hyp001p01 is down; deevnet.builder then manages it, and
    # its play excludes management_plane hosts so the two roles never cross.
    network_controllers:
      hosts:
        dv02nms001v01: {}

    # Tenant authoritative DNS (ADR-0004). Kept as its own functional group
    # even though the host is shared: the powerdns role and the Unbound
    # delegation target this group, so moving the service to a dedicated host
    # later is a one-line change here.
    #
    # Deliberately NOT in dns_servers - that group is the core router and
    # drives playbooks/opnsense.yml.
    tenant_dns:
      hosts:
        dv02idn001v01: {}

    # Terraform state store for tenants (ADR-0007). Its own group for the same
    # reason tenant_dns is: the service can move to another host by editing this
    # list, and tenants reach it by the `tfstate` name rather than by address.
    tenant_state:
      hosts:
        dv02prv001v01: {}

    # MQTT broker for custom-firmware embedded devices (network-segmentation.md
    # names mqtt01 as IoT Backend's typical inhabitant). Its own functional
    # group for the same reason tenant_dns and tenant_state are: the service can
    # move hosts by editing this list.
    #
    # The first consumer is EdS - the LP jacket stand subscribes from the IoT
    # segment and lightd publishes from the eds tenant. It is NOT an EdS-only
    # service, which is why it is substrate rather than a tenant VM.
    #
    # Populated by CHG-0015, which built VerneMQ here (ADR-0012 §8, replacing
    # mosquitto and dv02mqt001v01). The membership was held back until the
    # group's vault carried the broker's secrets, because the role refuses to
    # run without them and a member here would have stopped every site.yml run
    # on this host - the same reason openbao's group was held empty below.
    mqtt_brokers:
      hosts:
        dv02msg001v01: {}

    # OpenBao, the substrate's runtime secrets (ADR-0016), in the identity VM.
    # Held empty until the vault carried vault_openbao_seal_key, because the
    # role refuses to run without one and a member here would have stopped
    # every site.yml run on that host. Added in CHG-0010.
    openbao:
      hosts:
        dv02idn001v01: {}

    # The Deevnet API and its database (ADR-0012), in the provisioning VM.
    deevnet_api:
      hosts:
        dv02prv001v01: {}

    # Observability (ADR-0022, ADR-0023): one store on Platform for every log and
    # metric, partitioned by tenant index, and one collector on management that
    # scrapes what cannot push. These replaced the per-audience tob/sob in
    # CHG-0018.
    observability_store:
      hosts:
        dv02obs001v01: {}

    observability_collectors:
      hosts:
        dv02col001v01: {}
