# Tenant-facing management services host.
#
# A shared host for substrate services that tenants consume, not a DNS
# appliance. PowerDNS (ADR-0004) is its first service; others land beside it,
# each with its own CNAME so a service can move hosts without changing what
# consumers reference.
#
# The name describes audience, not ownership - the same convention as the
# tenant_transit / tenant_underlay VLANs of ADR-0002, which are substrate-owned
# segments named for the tenants they carry.
#
# Substrate-facing management services (observability, automation, access) are
# deliberately kept off this host. Their change cadence is much higher, and a
# restart there must not take tenant name resolution with it.

infrastructure:
  form: vm
  interfaces:
    eth0:
      # Deterministic MAC, generated outside Proxmox and stored here, per the
      # management-hypervisor MAC policy. The DHCP reservation and the A record
      # both key off this value, so a rebuilt VM keeps its identity.
      mac: "bc:24:11:a3:5c:1d"

env:
  role: tenant-mgmt
  interfaces:
    eth0:
      ip: 10.20.99.30
      purpose: mgmt
      segment: management
      dns:
        host_a_record: true
        dhcp_reservation: true
        # One CNAME per service endpoint. Consumers reference these, never the
        # host name, so a service can be moved without touching them.
        cnames:
          - tdns

# Where the VM comes from. Cloned by deevnet.mgmt.proxmox_vm on hv01.
#
# The template is matched by name prefix rather than by VMID: Proxmox assigns
# the next free ID on every image-factory rebuild, so a pinned ID goes stale.
mgmt_vm:
  hypervisor: hv01
  node: pve
  # Declared, not discovered - the VM keeps this ID across rebuilds so the
  # hypervisor's own view of it is stable. Unrelated to the template's ID,
  # which Proxmox reassigns on every image-factory rebuild.
  vmid: 200
  template_prefix: "fedora-server-"
  storage: local-lvm-big-thin
  cores: 2
  memory: 2048
  disk_size: 32
