all:
  children:

    infrastructure:
      children:

        network:
          children:
            routers:
              hosts:
                edge-rt01: {}
                core-rt02: {}
                core-rt01: {}

            dns_servers:
              hosts:
                core-rt02: {}

            dhcp_servers:
              hosts:
                core-rt02: {}

            switches:
              hosts:
                access-sw01: {}

            aps:
              hosts:
                ap01: {}

        compute:
          children:
            hypervisors:
              hosts:
                hv01: {}
                hv02: {}

            pis:
              hosts:
                pi01: {}
                pi02: {}
                pi03: {}
                pi04: {}

        storage:
          hosts: {}

        control_plane:
          hosts:
            provisioner-vm02: {}
            provisioner-vm03: {}

        # Extended management services on the management hypervisor (hv01).
        # Split by audience: tenant-facing services here, substrate-facing
        # ones on their own host when they arrive.
        #
        # Membership means "a management-plane VM whose identity is allocated"
        # (VMID -> MAC -> DHCP reservation), NOT "cloned from a template". The
        # vm_identity allocator scans exactly this group, and site.yml decides
        # per host whether proxmox_vm applies - provisioner-vm03 is PXE-built
        # and declares an identity only.
        management_plane:
          hosts:
            tenant-mgmt-vm01: {}
            tenant-state-vm01: {}
            provisioner-vm02: {}
            provisioner-vm03: {}

        oob_management:
          hosts:
            provisioner-ph01: {}

        edge_devices:
          hosts:
            bellgw-em01: {}
            # examples later:
            # jetson-em01: {}
            # mabell-em02: {}
            # console-pi05: {}

    # --- Functional / intent-based groupings (orthogonal) ---
    builder:
      hosts:
        provisioner-ph01: {}
        provisioner-vm02: {}
        provisioner-vm03: {}

    workstations:
      hosts:
        provisioner-ph01: {}
        provisioner-vm02: {}

    artifact_servers:
      hosts:
        provisioner-ph01: {}
        provisioner-vm02: {}

    bootstrap_nodes:
      hosts:
        provisioner-ph01: {}
        provisioner-vm02: {}

    network_controllers:
      hosts:
        provisioner-ph01: {}

    # Tenant authoritative DNS (ADR-0004). Kept as its own functional group
    # even though the host is shared: the powerdns role and the Unbound
    # delegation target this group, so moving the service to a dedicated host
    # later is a one-line change here.
    #
    # Deliberately NOT in dns_servers - that group is the core router and
    # drives playbooks/opnsense.yml.
    tenant_dns:
      hosts:
        tenant-mgmt-vm01: {}

    # Terraform state store for tenants (ADR-0007). Its own group for the same
    # reason tenant_dns is: the service can move to another host by editing this
    # list, and tenants reach it by the `tfstate` name rather than by address.
    tenant_state:
      hosts:
        tenant-state-vm01: {}

    # VyOS routers for vyos-site.yml playbook
    vyos_routers:
      hosts:
        core-rt01: {}
