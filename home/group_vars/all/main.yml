deevnet_root_domain: deevnet.net
deevnet_substrate: home

# Derive ansible_host from env.interfaces.<if>.ip
ansible_host: >-
  {{
    (
      env.interfaces
      | dict2items
      | selectattr('value.ansible', 'defined')
      | selectattr('value.ansible')
      | map(attribute='value.ip')
      | list
      | first
    )
    | default(
      (
        env.interfaces
        | dict2items
        | map(attribute='value.ip')
        | reject('equalto', None)
        | reject('equalto', 'dhcp')
        | list
        | first
      ),
      true
    )
  }}

# Deterministic FQDN helper
deevnet_fqdn: "{{ inventory_hostname }}.{{ deevnet_substrate }}.{{ deevnet_root_domain }}"

# --- Site identity ------------------------------------------------------------
# Two-digit site code, the second field of every hostname (ADR-0008 s3.2):
# dv{01}{rrr}{sss}{f}{gg}. Declared, not derived - deliberately independent of
# the addressing plan below, so renumbering a site does not rename its hosts.
deevnet_site_code: "01"

# Second octet of the site block: 20 = mobile, 10 = home (ADR-0002). Read from
# the addressing plan rather than restated, so the two cannot disagree.
deevnet_site_octet: "{{ deevnet_vlans.management.subnet.split('.')[1] }}"

# MAC namespace for addresses we ASSIGN, per docs/standards/mac-naming.
# 02 = locally administered, de = Deevnet, third octet = the site octet above,
# so the namespace follows the environment with no second place to edit.
#
# This governs MACs we assign to NICs we create. MACs we OBSERVE - bare-metal
# NICs, and the pre-existing Proxmox guests still carrying bc:24:11: addresses -
# are recorded as found and are never rewritten. Both live at
# infrastructure.interfaces.<iface>.mac and are authoritative in git.
deevnet_mac_namespace: "02:de:{{ deevnet_site_octet }}"

# VMID range the allocator draws management-plane identities from. The VMID is
# the sole source of the MAC, so this is also the MAC range. The hypervisors are
# not clustered, so uniqueness across the substrate is enforced by the allocator
# (deevnet.mgmt playbooks/vm-identity.yml), not by Proxmox.
#
# Ranges do not overlap between sites: home 100-199, mobile 200-299. The MAC
# namespace already differs by site octet, so this is not what keeps MACs apart
# - it makes the VMID itself unique estate-wide, so a VM restored onto the wrong
# site cannot land on an occupied identity.
deevnet_mgmt_vmid_range:
  start: 100
  end: 199
