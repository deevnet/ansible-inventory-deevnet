# VLAN segment definitions for home substrate
# Addressing convention: 10.10.{vlan_id}.0/24
deevnet_vlans:
  trusted:
    vlan_id: 10
    subnet: "10.10.10.0/24"
    gateway: "10.10.10.1"
    dhcp_range_start: "10.10.10.100"
    dhcp_range_end: "10.10.10.200"
    wifi_ssid: "DVNT"
  storage:
    vlan_id: 20
    subnet: "10.10.20.0/24"
    gateway: "10.10.20.1"
    dhcp_enabled: false  # Static mappings only
  platform:
    vlan_id: 25
    subnet: "10.10.25.0/24"
    gateway: "10.10.25.1"
    dhcp_enabled: false  # Static mappings only
  iot:
    vlan_id: 30
    subnet: "10.10.30.0/24"
    gateway: "10.10.30.1"
    dhcp_range_start: "10.10.30.100"
    dhcp_range_end: "10.10.30.200"
    wifi_ssid: "DVNT-IOT"
  iot_vendor:
    vlan_id: 31
    subnet: "10.10.31.0/24"
    gateway: "10.10.31.1"
    dhcp_range_start: "10.10.31.100"
    dhcp_range_end: "10.10.31.200"
    wifi_ssid: "DVNT-IOTV"
  iot_backend:
    vlan_id: 35
    subnet: "10.10.35.0/24"
    gateway: "10.10.35.1"
    dhcp_enabled: false  # Static mappings only
  guest:
    vlan_id: 40
    subnet: "10.10.40.0/24"
    gateway: "10.10.40.1"
    dhcp_range_start: "10.10.40.50"
    dhcp_range_end: "10.10.40.250"
    wifi_ssid: "DVNT-GUEST"
  # --- Tenant fabric transport (ADR-0001 / ADR-0002) ---------------------------
  # Tenants are NOT VLANs. A tenant is an EVPN/VXLAN overlay owned by the tenant
  # hypervisor's own SDN fabric, with its own anycast gateway and IPAM. The
  # substrate therefore carries exactly two tenant-related segments, and adding a
  # tenant requires no change here and no switch change.
  #
  # Replaced tenant_1/2/3 (VLAN 50/51/52), the superseded Option A model in which
  # each tenant was a core-router-owned VLAN.
  tenant_transit:
    vlan_id: 50
    subnet: "10.10.50.0/24"
    gateway: "10.10.50.1"
    dhcp_enabled: false  # Static: fabric exit nodes only
  tenant_underlay:
    vlan_id: 51
    # Deliberately no subnet/gateway, like blackhole below. VTEP-to-VTEP
    # transport between fabric members; fabric-side addressing (10.10.51.0/24)
    # lives with the fabric, not in the substrate VLAN table.
    dhcp_enabled: false
  management:
    vlan_id: 99
    subnet: "10.10.99.0/24"
    gateway: "10.10.99.1"
    dhcp_enabled: false  # Static mappings only for infrastructure
  blackhole:
    vlan_id: 999
    dhcp_enabled: false
