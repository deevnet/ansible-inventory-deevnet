# Zone-based firewall policy matrix for home substrate
# Derived from network-segmentation.md architecture.
# Default policy: deny all inter-VLAN traffic.
# Rules below define explicit allows.
#
# Zones map 1:1 to deevnet_vlans keys. tenant_underlay has no zone on purpose -
# it carries no routed traffic and the core router holds no address on it.
#
# Deliberately narrower than mobile: there is no trusted -> management pass here.
# That rule is a lab convenience on mobile, carried for hands-on access to the
# management plane, and it is not a policy this site inherits.

firewall_zone_policies:
  # Management -> all zones (full infrastructure access)
  - { from_zone: management, to_zone: trusted, action: pass }
  - { from_zone: management, to_zone: storage, action: pass }
  - { from_zone: management, to_zone: platform, action: pass }
  - { from_zone: management, to_zone: iot, action: pass }
  - { from_zone: management, to_zone: iot_vendor, action: pass }
  - { from_zone: management, to_zone: iot_backend, action: pass }
  - { from_zone: management, to_zone: guest, action: pass }
  - { from_zone: management, to_zone: tenant_transit, action: pass }

  # Trusted -> broad access (not management, not guest, not iot_vendor)
  - { from_zone: trusted, to_zone: storage, action: pass }
  - { from_zone: trusted, to_zone: platform, action: pass }
  - { from_zone: trusted, to_zone: iot, action: pass }
  - { from_zone: trusted, to_zone: iot_backend, action: pass }
  - { from_zone: trusted, to_zone: tenant_transit, action: pass }

  # Tenant fabric -> platform only (shared services).
  # Per ADR-0001 the core router sees the aggregate transit network, never an
  # individual tenant subnet: tenant traffic arrives here already SNATed by the
  # fabric exit node. Per-tenant isolation is enforced inside the fabric (one
  # VRF per tenant), not by a rule here.
  - { from_zone: tenant_transit, to_zone: platform, action: pass }

  # IoT -> IoT Backend (sensor data)
  - { from_zone: iot, to_zone: iot_backend, action: pass }

  # IoT Backend -> Platform (shared services)
  - { from_zone: iot_backend, to_zone: platform, action: pass }

firewall_internet_zones:
  - management
  - trusted
  - platform
  - iot
  - iot_vendor
  - iot_backend
  - guest
  - tenant_transit
